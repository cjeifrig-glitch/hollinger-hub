UNITS.push(
{id:4, name:"Probability, Random Variables, and Probability Distributions", short:"Probability & Random Variables", weight:"10–20%", wmid:15,
 hol:"Hollinger Unit 3: Probability (3.1–3.6), test 10/16. Hollinger Unit 4: Random Variables (4.1–4.7), test 11/9.",
 big:"Probability is long-run relative frequency. Build the sample space or a tree, apply the rules, and for random variables compute mean and SD the way the formula sheet shows.",
 lessons:[
  {n:"3.1", t:"Introduction to probability", info:"The probability of an event is its long-run relative frequency. The Law of Large Numbers: as trials increase, the observed proportion settles toward the true probability. Short runs are streaky; there is no law of averages.", key:"A coin has no memory. After five heads, P(heads) is still 0.5."},
  {n:"3.2", t:"Simulation", info:"A simulation imitates chance behavior. State how a random digit or device represents one outcome, describe one trial and what to record, repeat many trials, and use the proportion of trials with the event as the estimated probability.", key:"Describe: assign digits, run one trial, repeat, compute proportion."},
  {n:"3.3", t:"Rules for probability", info:"0 ≤ P(A) ≤ 1; probabilities in a sample space sum to 1; complement rule P(Aᶜ) = 1 − P(A). Mutually exclusive (disjoint) events cannot happen together, so P(A and B) = 0.", key:"\"At least one\" = 1 − P(none)."},
  {n:"3.4", t:"The addition rule", info:"P(A or B) = P(A) + P(B) − P(A and B). Venn diagrams and two-way tables organize the counts. For disjoint events the overlap term is zero.", key:"Subtract the overlap or you double count."},
  {n:"3.5", t:"Conditional probability and independence", info:"P(A | B) = P(A and B) / P(B). A and B are independent if P(A | B) = P(A), equivalently P(A and B) = P(A)·P(B). Mutually exclusive events with nonzero probability are never independent.", key:"Independence is a calculation to verify, not a vibe."},
  {n:"3.6", t:"Tree diagrams", info:"Tree diagrams handle sequences of events: multiply along branches, add across branches that give the same result. Reverse conditionals (given the test is positive, what is the chance of disease) come from the tree: P(A | B) = P(A and B) / P(B).", key:"General multiplication rule: P(A and B) = P(A)·P(B | A)."},
  {n:"4.1", t:"Discrete random variables", info:"A probability distribution lists each value and its probability. Mean (expected value) μₓ = Σ xᵢ·pᵢ. Variance σ²ₓ = Σ (xᵢ − μₓ)²·pᵢ; SD is its square root. Interpret the mean as the long-run average per trial.", key:"Expected value is a long-run average, not a value you expect on one trial."},
  {n:"4.2", t:"Continuous random variables", info:"A continuous random variable takes values on an interval; probabilities are areas under a density curve, and the total area is 1. The probability of any single exact value is 0.", key:"P(X ≤ 3) = P(X < 3) for continuous X."},
  {n:"4.3–4.4", t:"Normal distributions and calculations", info:"Standardize with z, then use Table A or normalcdf(lower, upper, μ, σ). For a percentile, use invNorm. Always show the model, the boundary, the z-score (or calculator command with inputs), and the answer.", key:"Full credit needs: distribution named with parameters, shaded sketch or z, probability."},
  {n:"4.5", t:"Combining random variables", info:"For any X and Y: μ(X ± Y) = μₓ ± μᵧ. For INDEPENDENT X and Y: σ²(X ± Y) = σ²ₓ + σ²ᵧ. Variances always add, even when subtracting; standard deviations never add. Linear transforms: μ(a + bX) = a + bμₓ, σ(a + bX) = |b|σₓ.", key:"Variances add. Standard deviations do not."},
  {n:"4.6", t:"The binomial distribution", info:"BINS: Binary outcomes, Independent trials, fixed Number n, same probability p. P(X = k) = (n choose k) pᵏ(1−p)ⁿ⁻ᵏ. μ = np, σ = √(np(1−p)). Geometric: trials until the first success, P(X = k) = (1−p)ᵏ⁻¹p, μ = 1/p.", key:"binompdf for exactly k; binomcdf for at most k."},
  {n:"4.7", t:"Conditions and the 10% rule", info:"Sampling without replacement is approximately binomial when the sample is less than 10% of the population. A binomial is approximately normal when np ≥ 10 and n(1−p) ≥ 10 (the Large Counts condition).", key:"These two conditions come back in every inference unit."}
 ],
 formulas:["P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","P(A | B) = P(A ∩ B) / P(B)","μₓ = Σ xᵢ pᵢ;  σₓ = √Σ (xᵢ − μₓ)² pᵢ","Binomial: P(X=k) = C(n,k) pᵏ (1−p)ⁿ⁻ᵏ;  μ = np;  σ = √(np(1−p))","Geometric: P(X=k) = (1−p)ᵏ⁻¹ p;  μ = 1/p","Independent X, Y: σ²(X±Y) = σ²ₓ + σ²ᵧ"],
 traps:["Disjoint and independent are different ideas. Disjoint means they cannot both happen; independent means one does not change the other's probability.","P(A | B) and P(B | A) are different numbers. Read 'given' carefully.","When combining variables, add variances only if the variables are independent.","Binomial 'at least 3' is 1 − binomcdf(n, p, 2)."],
 mcq:[
  {t:"3.4", s:"In a class, 60% play a sport, 30% play an instrument, and 15% do both. What percent play a sport or an instrument?", o:["90%","75%","45%","85%"], a:1, w:"P(S or I) = 0.60 + 0.30 − 0.15 = 0.75."},
  {t:"3.5", s:"In a class, 60% play a sport, 30% play an instrument, and 15% do both. Given that a student plays an instrument, what is the probability they also play a sport?", o:["0.15","0.25","0.50","0.60"], a:2, w:"P(S | I) = P(S and I)/P(I) = 0.15/0.30 = 0.50."},
  {t:"3.5", s:"Events A and B have P(A) = 0.4, P(B) = 0.5, and P(A and B) = 0.2. Which is true?", o:["A and B are mutually exclusive","A and B are independent","P(A or B) = 0.9","P(A | B) = 0.5 and they are therefore disjoint"], a:1, w:"P(A)·P(B) = 0.20 = P(A and B), so they are independent. They overlap, so they are not disjoint; P(A or B) = 0.7."},
  {t:"3.3", s:"A fair six-sided die is rolled 4 times. The probability of at least one 6 is", o:["(1/6)⁴","4/6","1 − (5/6)⁴","(5/6)⁴"], a:2, w:"At least one = 1 − P(no sixes) = 1 − (5/6)⁴ ≈ 0.518."},
  {t:"3.6", s:"2% of people have a disease. A test is positive for 95% of people with the disease and for 10% of people without it. The probability a randomly chosen person tests positive is", o:["0.019","0.098","0.117","0.95"], a:2, w:"Tree: P(+) = 0.02(0.95) + 0.98(0.10) = 0.019 + 0.098 = 0.117."},
  {t:"3.6", s:"2% of people have a disease. A test is positive for 95% of people with the disease and for 10% of people without it. The probability that a person who tests positive actually has the disease is closest to", o:["0.95","0.16","0.02","0.84"], a:1, w:"P(D | +) = 0.019/0.117 ≈ 0.162. Most positives are false positives because the disease is rare."},
  {t:"4.1", s:"A game pays $10 with probability 0.1, $2 with probability 0.3, and $0 otherwise. The expected payout is", o:["$1.60","$4.00","$6.00","$1.00"], a:0, w:"μ = 10(0.1) + 2(0.3) + 0(0.6) = 1.60. In the long run the game pays about $1.60 per play."},
  {t:"4.5", s:"X has mean 50 and SD 4; Y has mean 30 and SD 3; X and Y are independent. The standard deviation of X − Y is", o:["1","7","5","25"], a:2, w:"Variances add: 16 + 9 = 25, so SD = 5. Standard deviations never add or subtract directly."},
  {t:"4.6", s:"A basketball player makes 70% of free throws. In 10 independent attempts, the probability of exactly 8 makes is", o:["C(10,8)(0.7)⁸(0.3)²","(0.7)⁸(0.3)²","C(10,8)(0.3)⁸(0.7)²","8/10"], a:0, w:"Binomial with n = 10, p = 0.7, k = 8. Include the combinations term for the number of orderings."},
  {t:"4.6", s:"A basketball player makes 70% of free throws. In 10 independent attempts, the mean and standard deviation of the number of makes are", o:["7 and 2.1","7 and 1.45","0.7 and 0.21","7 and 1.0"], a:1, w:"μ = np = 7. σ = √(10·0.7·0.3) = √2.1 ≈ 1.45."},
  {t:"4.4", s:"Battery life is approximately normal with mean 20 hours and SD 2 hours. The probability a battery lasts more than 23 hours is closest to", o:["0.067","0.933","0.15","0.5"], a:0, w:"z = (23 − 20)/2 = 1.5. P(Z > 1.5) ≈ 0.0668."},
  {t:"3.1", s:"A fair coin has landed heads 6 times in a row. The probability the next flip is heads is", o:["less than 0.5, because tails is due","0.5","greater than 0.5, because the coin is hot","impossible to determine"], a:1, w:"Flips are independent. The Law of Large Numbers describes the long run; it does not correct short runs."},
  {t:"4.6", s:"A student guesses on multiple-choice questions with 5 options until the first correct answer. The expected number of questions attempted is", o:["0.2","1","5","25"], a:2, w:"Geometric with p = 0.2. μ = 1/p = 5."},
  {t:"4.7", s:"A poll samples 1,000 adults from a city of 50,000 without replacement. Treating the count who support a measure as binomial is reasonable because", o:["n is large","the sample is less than 10% of the population","the population is normal","np ≥ 10"], a:1, w:"The 10% condition makes the lack of independence from sampling without replacement negligible."}
 ],
 frq:{title:"Probability with a tree and a random variable", prompt:["At an airport, 70% of travelers check a bag. Among those who check a bag, 12% have a bag delayed; among those who do not, 0% do. A traveler is selected at random.","(a) Find the probability that the traveler has a delayed bag.","(b) Given that a traveler's bag was not delayed, find the probability they checked a bag.","(c) Let X be the number of travelers with a delayed bag among 5 randomly selected travelers. Identify the distribution of X and find P(X ≥ 1).","(d) Interpret the expected value of X."],
  model:["(a) P(delayed) = 0.70 × 0.12 = 0.084.","(b) P(checked and not delayed) = 0.70 × 0.88 = 0.616. P(not delayed) = 1 − 0.084 = 0.916. P(checked | not delayed) = 0.616/0.916 ≈ 0.672.","(c) X is binomial with n = 5 and p = 0.084 (fixed trials, independent travelers, two outcomes, same p). P(X ≥ 1) = 1 − (0.916)⁵ ≈ 1 − 0.645 = 0.355.","(d) μ = 5 × 0.084 = 0.42. If we repeatedly took groups of 5 travelers, the average number with a delayed bag would be about 0.42 per group in the long run."],
  rubric:["(a) show the multiplication along the branch.","(b) correct numerator (joint) and denominator (marginal), with work.","(c) name the distribution AND its parameters; use the complement for 'at least one'.","(d) 'long-run average' in context earns the point; 'we expect 0.42 bags' alone does not."]}
},
{id:5, name:"Sampling Distributions", short:"Sampling Distributions", weight:"7–12%", wmid:9,
 hol:"Hollinger Unit 5: Sampling Distributions (5.1–5.7), test 12/10, followed by an AP review day.",
 big:"A statistic varies from sample to sample. Its sampling distribution has a center (unbiased if the mean equals the parameter), a spread that shrinks with √n, and a shape that becomes normal under conditions.",
 lessons:[
  {n:"5.1", t:"What is a sampling distribution", info:"Parameter: a number describing the population (p, μ). Statistic: a number from a sample (p̂, x̄). The sampling distribution of a statistic is the distribution of its values over all possible samples of size n.", key:"Three distributions: population, one sample, and the sampling distribution of the statistic."},
  {n:"5.2", t:"Bias and variability", info:"A statistic is unbiased if the mean of its sampling distribution equals the parameter. Variability of a statistic is described by its spread; larger samples give less variability. The population size barely matters as long as it is at least 10 times the sample.", key:"Bias = centered in the wrong place. Variability = spread."},
  {n:"5.3", t:"Sample proportions", info:"Mean of p̂ is p. SD of p̂ is √(p(1−p)/n) when the 10% condition holds. Shape is approximately normal when np ≥ 10 and n(1−p) ≥ 10.", key:"σ(p̂) = √(p(1−p)/n)"},
  {n:"5.4", t:"Difference in sample proportions", info:"For two independent samples, mean of p̂₁ − p̂₂ is p₁ − p₂ and SD is √(p₁(1−p₁)/n₁ + p₂(1−p₂)/n₂). Normal when all four counts are at least 10.", key:"Variances add, even for a difference."},
  {n:"5.5", t:"Sample means", info:"Mean of x̄ is μ. SD of x̄ is σ/√n (10% condition). If the population is normal, x̄ is exactly normal for any n.", key:"Quadrupling n halves the SD of x̄."},
  {n:"5.6", t:"The Central Limit Theorem", info:"When n is large (rule of thumb n ≥ 30), the sampling distribution of x̄ is approximately normal regardless of the population's shape. For smaller n, you need a normal population or a graph of the sample with no strong skew or outliers.", key:"The CLT is about the shape of x̄, not the shape of the data."},
  {n:"5.7", t:"Difference in sample means", info:"Mean of x̄₁ − x̄₂ is μ₁ − μ₂; SD is √(σ₁²/n₁ + σ₂²/n₂) for independent samples. Approximately normal when both populations are normal or both samples are large.", key:"Check normality or n ≥ 30 for EACH sample."}
 ],
 formulas:["μ(p̂) = p;  σ(p̂) = √(p(1−p)/n)","μ(x̄) = μ;  σ(x̄) = σ/√n","σ(p̂₁ − p̂₂) = √(p₁(1−p₁)/n₁ + p₂(1−p₂)/n₂)","σ(x̄₁ − x̄₂) = √(σ₁²/n₁ + σ₂²/n₂)"],
 traps:["The SD of x̄ is σ/√n, not σ/n.","Large Counts (np ≥ 10, n(1−p) ≥ 10) is for proportions. Normal/Large Sample (n ≥ 30) is for means.","A sampling distribution describes many samples; a single sample's histogram is not it.","Increasing the sample size reduces variability but has no effect on bias."],
 mcq:[
  {t:"5.3", s:"35% of a large population supports a policy. In random samples of 200, the standard deviation of the sample proportion is closest to", o:["0.034","0.0011","0.35","0.065"], a:0, w:"σ(p̂) = √(0.35 × 0.65 / 200) = √0.0011375 ≈ 0.0337."},
  {t:"5.5", s:"A population has mean 80 and SD 12. For random samples of size 36, the sampling distribution of x̄ has mean and SD", o:["80 and 12","80 and 2","80 and 0.33","13.3 and 2"], a:1, w:"The mean of x̄ equals μ = 80. SD = 12/√36 = 2."},
  {t:"5.6", s:"The population of household incomes is strongly right-skewed. For random samples of 100 households, the sampling distribution of the sample mean is", o:["strongly right-skewed","approximately normal because of the Central Limit Theorem","uniform","exactly normal because incomes are continuous"], a:1, w:"n = 100 is large, so by the CLT x̄ is approximately normal even though the population is skewed."},
  {t:"5.2", s:"Which change reduces the variability of a sample proportion?", o:["Increasing the population size","Increasing the sample size","Using a biased sampling method","Decreasing the sample size"], a:1, w:"SD of p̂ = √(p(1−p)/n) shrinks as n grows. Population size does not appear in the formula (10% condition)."},
  {t:"5.3", s:"For which sample size is the sampling distribution of p̂ approximately normal when p = 0.05?", o:["n = 50","n = 100","n = 150","n = 250"], a:3, w:"Need np ≥ 10: 0.05n ≥ 10 → n ≥ 200. Only 250 qualifies."},
  {t:"5.5", s:"To cut the standard deviation of x̄ in half, the sample size must be", o:["doubled","halved","quadrupled","increased by 2"], a:2, w:"SD = σ/√n. Multiplying n by 4 multiplies √n by 2, halving the SD."},
  {t:"5.1", s:"Which is a statistic?", o:["The proportion of all U.S. voters who voted","The mean height of all students at a school","The mean GPA of 50 randomly selected seniors","The population standard deviation"], a:2, w:"A statistic is computed from a sample. The others describe entire populations, so they are parameters."},
  {t:"5.2", s:"The histogram of a simulated sampling distribution is centered at 0.52 when the true proportion is 0.60. The statistic appears to be", o:["unbiased with low variability","biased","highly variable","approximately normal"], a:1, w:"The center of the sampling distribution does not match the parameter, which is the definition of bias."},
  {t:"5.5", s:"Scores are normal with mean 500 and SD 100. The probability that the mean of 25 random scores exceeds 540 is closest to", o:["0.345","0.023","0.5","0.655"], a:1, w:"SD of x̄ = 100/√25 = 20. z = (540 − 500)/20 = 2. P(Z > 2) ≈ 0.0228."},
  {t:"5.7", s:"Two independent random samples have σ₁ = 6, n₁ = 36, σ₂ = 8, n₂ = 64. The SD of x̄₁ − x̄₂ is", o:["√2","2","14","0.5"], a:0, w:"√(36/36 + 64/64) = √(1 + 1) = √2 ≈ 1.41."},
  {t:"5.6", s:"A random sample of 12 is taken from a population with unknown shape. To use a normal model for x̄, you should", o:["apply the CLT since any n works","check a graph of the sample data for strong skew or outliers","assume normality because the sample is random","use n ≥ 10 as the condition"], a:1, w:"With n < 30 the CLT does not apply, so normality is judged from a graph of the sample data."}
 ],
 frq:{title:"Sampling distribution of a proportion", prompt:["A university claims 64% of its students graduate in four years. A reporter takes a random sample of 150 students and finds 84 graduated in four years.","(a) Describe the sampling distribution of the sample proportion p̂ for samples of size 150 if the claim is true: shape, center, spread. Justify the shape.","(b) Find the probability of getting a sample proportion of 0.56 or lower if the claim is true.","(c) Does the result give convincing evidence that the claim is false? Explain."],
  model:["(a) Center: μ(p̂) = 0.64. Spread: σ(p̂) = √(0.64 × 0.36 / 150) ≈ 0.0392, assuming the 150 students are less than 10% of the student body. Shape: approximately normal because np = 96 ≥ 10 and n(1−p) = 54 ≥ 10.","(b) p̂ = 84/150 = 0.56. z = (0.56 − 0.64)/0.0392 ≈ −2.04. P(p̂ ≤ 0.56) ≈ 0.021.","(c) Yes. If the claim were true, a sample proportion of 0.56 or lower would happen only about 2% of the time, which is unlikely by chance alone. This is convincing evidence the true four-year graduation rate is below 64%."],
  rubric:["(a) three features, with the Large Counts numbers written out and the 10% condition mentioned for independence.","(b) z-score or normalcdf with inputs shown, correct probability.","(c) link the small probability to 'unlikely by chance' and state the conclusion in context."]}
},
{id:6, name:"Inference for Categorical Data: Proportions", short:"Inference: Proportions", weight:"12–15%", wmid:13,
 hol:"Expected to open Hollinger's spring semester. The structure learned here (state, plan, do, conclude) repeats for every inference unit.",
 big:"Confidence intervals estimate a parameter with a margin of error. Significance tests weigh evidence against a null hypothesis with a P-value. Four steps every time: State, Plan, Do, Conclude.",
 lessons:[
  {n:"6.1–6.2", t:"Confidence intervals for a proportion", info:"Interval = statistic ± (critical value)(standard error): p̂ ± z*√(p̂(1−p̂)/n). Conditions: random sample, 10% condition if sampling without replacement, Large Counts using the observed counts (np̂ ≥ 10 and n(1−p̂) ≥ 10).", key:"z* = 1.645 (90%), 1.960 (95%), 2.576 (99%)."},
  {n:"6.3", t:"Interpreting intervals and confidence level", info:"Interval interpretation: 'We are 95% confident the interval from A to B captures the true proportion of [context].' Level interpretation: 'If we took many samples and built an interval each time, about 95% of the intervals would capture the true proportion.'", key:"Never say there is a 95% probability the parameter is in THIS interval."},
  {n:"6.4", t:"Sample size and margin of error", info:"Margin of error = z*√(p̂(1−p̂)/n). To plan n, solve z*√(p*(1−p*)/n) ≤ ME using a guess p* or the conservative p* = 0.5. Higher confidence widens the interval; larger n narrows it.", key:"Margin of error covers random sampling variability only, never bias."},
  {n:"6.5", t:"Setting up a test for a proportion", info:"Hypotheses are about the parameter p, never p̂. H₀: p = p₀; Hₐ: p < p₀, p > p₀, or p ≠ p₀. The null is the claim of 'no change' or the value being tested.", key:"Write hypotheses with the parameter and define it in context."},
  {n:"6.6", t:"Carrying out the test", info:"Conditions: random, 10%, Large Counts using p₀ (np₀ ≥ 10, n(1−p₀) ≥ 10). Test statistic z = (p̂ − p₀)/√(p₀(1−p₀)/n). The P-value is the probability, assuming H₀ is true, of a statistic at least as extreme as observed.", key:"Use p₀ in the standard error for the test, p̂ for the interval."},
  {n:"6.7", t:"Conclusions and errors", info:"If P ≤ α, reject H₀: convincing evidence for Hₐ. If P > α, fail to reject: not convincing evidence. Type I error: reject a true H₀ (probability α). Type II error: fail to reject a false H₀. Power is the probability of correctly rejecting a false H₀.", key:"Never 'accept H₀'. Fail to reject."},
  {n:"6.8–6.11", t:"Two-sample proportions", info:"Two-sample z interval: (p̂₁ − p̂₂) ± z*√(p̂₁(1−p̂₁)/n₁ + p̂₂(1−p̂₂)/n₂). Two-sample z test uses the pooled proportion p̂c = (X₁ + X₂)/(n₁ + n₂) in the standard error. Conditions apply to both samples.", key:"If the interval for p₁ − p₂ contains 0, there is no convincing evidence of a difference."}
 ],
 formulas:["One-prop z interval: p̂ ± z*√(p̂(1−p̂)/n)","One-prop z test: z = (p̂ − p₀)/√(p₀(1−p₀)/n)","Two-prop z interval: (p̂₁ − p̂₂) ± z*√(p̂₁(1−p̂₁)/n₁ + p̂₂(1−p̂₂)/n₂)","Two-prop z test: z = (p̂₁ − p̂₂)/√(p̂c(1−p̂c)(1/n₁ + 1/n₂))"],
 traps:["Conditions must be checked with numbers written out, not just named.","P-value definition: probability of getting a result at least this extreme IF H₀ is true. It is not the probability H₀ is true.","A confidence level describes the method's long-run capture rate, not one interval.","Power increases with larger n, larger α, and a true value farther from p₀."],
 mcq:[
  {t:"6.2", s:"In a random sample of 400 voters, 220 support a candidate. A 95% confidence interval for the true proportion is approximately", o:["0.55 ± 0.025","0.55 ± 0.049","0.55 ± 0.064","0.55 ± 0.0005"], a:1, w:"p̂ = 0.55. SE = √(0.55 × 0.45/400) ≈ 0.0249. ME = 1.96 × 0.0249 ≈ 0.049."},
  {t:"6.3", s:"Which is a correct interpretation of a 95% confidence interval (0.50, 0.60) for the proportion of students who bike to school?", o:["95% of students bike to school between 50% and 60% of the time","There is a 95% probability that the true proportion is between 0.50 and 0.60","We are 95% confident that the interval 0.50 to 0.60 captures the true proportion of students who bike","95% of samples will have a proportion between 0.50 and 0.60"], a:2, w:"The confidence is in the method that produced the interval. The parameter is fixed, so probability statements about it are wrong."},
  {t:"6.4", s:"Compared with a 95% interval from the same sample, a 99% confidence interval will be", o:["narrower","wider","the same width","centered at a different value"], a:1, w:"Higher confidence requires a larger critical value (2.576 vs 1.960), widening the interval around the same p̂."},
  {t:"6.4", s:"A pollster wants a margin of error of 0.03 at 95% confidence with no prior estimate. The minimum sample size is about", o:["267","1,068","3,000","34"], a:1, w:"Use p* = 0.5: n ≥ (1.96/0.03)² × 0.25 ≈ 1067.1, so 1,068."},
  {t:"6.5", s:"A company claims 90% of packages arrive on time. A consumer group suspects the rate is lower. The hypotheses are", o:["H₀: p̂ = 0.90, Hₐ: p̂ < 0.90","H₀: p = 0.90, Hₐ: p < 0.90","H₀: p < 0.90, Hₐ: p = 0.90","H₀: p = 0.90, Hₐ: p ≠ 0.90"], a:1, w:"Hypotheses are about the parameter p. The suspicion 'lower' makes a one-sided alternative."},
  {t:"6.6", s:"A test yields P-value = 0.03. Which is the correct interpretation?", o:["There is a 3% chance H₀ is true","If H₀ is true, there is a 3% probability of getting a sample result at least this extreme","There is a 3% chance the alternative is true","3% of samples will reject H₀"], a:1, w:"The P-value is a conditional probability computed assuming the null is true."},
  {t:"6.7", s:"At α = 0.05, a P-value of 0.08 leads to", o:["rejecting H₀; convincing evidence for Hₐ","failing to reject H₀; not convincing evidence for Hₐ","accepting H₀ as true","a Type I error"], a:1, w:"P > α, so we fail to reject. We never 'accept' the null, and no error type can be identified without knowing the truth."},
  {t:"6.7", s:"A drug is tested with H₀: the drug is not effective. A Type I error would be", o:["concluding the drug is effective when it is not","concluding the drug is not effective when it is","failing to run the test","choosing α too small"], a:0, w:"Type I = rejecting a true null = declaring an effect that does not exist."},
  {t:"6.7", s:"Which change increases the power of a test?", o:["Decreasing the sample size","Decreasing α from 0.05 to 0.01","Increasing the sample size","Using a two-sided alternative instead of one-sided"], a:2, w:"More data makes the sampling distribution narrower, so a real effect is easier to detect."},
  {t:"6.6", s:"Testing H₀: p = 0.5 with p̂ = 0.56 from n = 200, the test statistic is", o:["1.70","1.20","0.06","2.40"], a:0, w:"SE = √(0.5 × 0.5/200) = 0.0354. z = (0.56 − 0.50)/0.0354 ≈ 1.70. Use p₀, not p̂, in the denominator."},
  {t:"6.10", s:"A 95% interval for p₁ − p₂ is (−0.02, 0.10). The appropriate conclusion is", o:["p₁ is significantly larger than p₂","there is not convincing evidence of a difference between p₁ and p₂ at the 5% level","p₂ is significantly larger than p₁","the samples were too small to compute an interval"], a:1, w:"The interval includes 0, so 'no difference' is a plausible value for p₁ − p₂."},
  {t:"6.2", s:"Which condition for a one-proportion z interval is checked using the observed counts rather than a hypothesized value?", o:["Random","10% condition","Large Counts: np̂ ≥ 10 and n(1−p̂) ≥ 10","Normal population"], a:2, w:"Intervals have no hypothesized p₀, so successes and failures in the sample must each be at least 10."}
 ],
 frq:{title:"One-proportion z test, all four steps", prompt:["A school claims that 80% of its graduates attend a four-year college. A newspaper takes a random sample of 120 recent graduates and finds 88 attending four-year colleges. Is there convincing evidence at α = 0.05 that the true proportion is less than 0.80?"],
  model:["State: H₀: p = 0.80, Hₐ: p < 0.80, where p is the true proportion of this school's graduates attending four-year colleges. α = 0.05.","Plan: one-sample z test for p. Random: a random sample was taken. 10%: 120 is less than 10% of all graduates (assume at least 1,200 graduates). Large Counts: 120(0.80) = 96 ≥ 10 and 120(0.20) = 24 ≥ 10.","Do: p̂ = 88/120 ≈ 0.733. z = (0.733 − 0.80)/√(0.80 × 0.20/120) = −0.067/0.0365 ≈ −1.83. P-value = P(Z < −1.83) ≈ 0.034.","Conclude: Because 0.034 < 0.05, we reject H₀. There is convincing evidence that the proportion of this school's graduates attending four-year colleges is less than 0.80."],
  rubric:["State: parameter defined in context; both hypotheses.","Plan: name the test; check all three conditions with numbers.","Do: test statistic and P-value, correct to the digit.","Conclude: compare P to α, reject/fail to reject, then the evidence sentence in context about Hₐ."]}
}
);
UNITS.push(
{id:7, name:"Inference for Quantitative Data: Means", short:"Inference: Means", weight:"10–18%", wmid:14,
 hol:"Expected in Hollinger's spring semester after proportions. Same four steps, now with t.",
 big:"When σ is unknown you estimate it with s, and the test statistic follows a t distribution with n − 1 degrees of freedom. Paired data become one sample of differences.",
 lessons:[
  {n:"7.1", t:"The t distribution", info:"t distributions are bell-shaped, centered at 0, with heavier tails than the normal; as degrees of freedom grow they approach the standard normal. Use t whenever σ is estimated by s.", key:"df = n − 1 for one sample."},
  {n:"7.2–7.3", t:"Confidence interval for a mean", info:"x̄ ± t*·s/√n. Conditions: random, 10% if without replacement, Normal/Large Sample: population normal, or n ≥ 30, or a graph of the sample with no strong skew or outliers.", key:"Use invT(area, df) or Table B for t*."},
  {n:"7.4–7.5", t:"Significance test for a mean", info:"H₀: μ = μ₀. t = (x̄ − μ₀)/(s/√n), df = n − 1. P-value from tcdf. Conclusions follow the same reject / fail-to-reject language.", key:"Interpret in context: 'convincing evidence that the mean [variable] for [population] is ...'."},
  {n:"7.6", t:"Paired data", info:"When each subject gives two measurements (before/after, left/right) or pairs are matched, compute the differences and run a one-sample t procedure on them. The parameter is μ_d, the mean difference.", key:"Paired ≠ two-sample. Look for two measurements on the same unit."},
  {n:"7.7–7.9", t:"Two-sample t for a difference in means", info:"Interval: (x̄₁ − x̄₂) ± t*√(s₁²/n₁ + s₂²/n₂). Test: t = (x̄₁ − x̄₂)/√(s₁²/n₁ + s₂²/n₂). The calculator's df formula is messy; the conservative df is the smaller n − 1. Check conditions for both samples.", key:"Never pool unless told the variances are equal (AP does not expect pooling)."},
  {n:"7.10", t:"Skills check: choosing the procedure", info:"One mean (t), one proportion (z), paired differences (one-sample t on differences), two independent means (two-sample t), two proportions (two-sample z). Identify the variable type and the number of groups first.", key:"Categorical → proportions (z). Quantitative → means (t)."}
 ],
 formulas:["One-sample t: t = (x̄ − μ₀)/(s/√n), df = n − 1","One-sample t interval: x̄ ± t*·s/√n","Two-sample t: t = (x̄₁ − x̄₂)/√(s₁²/n₁ + s₂²/n₂)","Paired: run one-sample t on the differences d"],
 traps:["Use t, not z, whenever you only have the sample SD s.","The Normal/Large Sample condition is about the shape of the population or the sample size, not the sample mean.","For small samples, you must mention a graph of the data (dotplot/boxplot) to justify normality.","A two-sample t interval that contains 0 means no convincing evidence of a difference."],
 mcq:[
  {t:"7.2", s:"A random sample of 16 bags has mean weight 10.2 oz and SD 0.4 oz. The 95% confidence interval for the true mean weight uses a critical value of", o:["z* = 1.96","t* = 2.131 with 15 df","t* = 2.120 with 16 df","t* = 1.753 with 15 df"], a:1, w:"σ is unknown and n = 16, so use t with df = 15. For 95% confidence t* = 2.131."},
  {t:"7.2", s:"A random sample of 16 bags has mean weight 10.2 oz and SD 0.4 oz. The margin of error for a 95% confidence interval for the true mean weight is approximately", o:["0.1","0.213","0.4","0.853"], a:1, w:"ME = 2.131 × 0.4/√16 = 2.131 × 0.1 ≈ 0.213 oz."},
  {t:"7.1", s:"Compared with the standard normal distribution, a t distribution with 5 degrees of freedom", o:["is centered at a different value","has thinner tails","has heavier tails and more spread","is skewed right"], a:2, w:"Estimating σ with s adds uncertainty, producing heavier tails. With more df the t curve approaches the normal."},
  {t:"7.4", s:"A manufacturer claims mean battery life is 40 hours. A sample of 25 has mean 38.5 and SD 5. The test statistic is", o:["−0.3","−1.5","−7.5","1.5"], a:1, w:"t = (38.5 − 40)/(5/√25) = −1.5/1 = −1.5."},
  {t:"7.6", s:"Twenty students take a pretest and a posttest. To test whether scores improved, the appropriate procedure is", o:["a two-sample t test","a paired t test on the differences","a two-proportion z test","a chi-square test"], a:1, w:"Two measurements on the same student are paired. Analyze the 20 differences with a one-sample t procedure."},
  {t:"7.3", s:"A random sample of 12 values shows strong right skew and one outlier. Which is the appropriate response regarding a t interval?", o:["Proceed; t procedures are robust for any n","Proceed because the sample is random","Do not proceed; the Normal/Large Sample condition is not met","Use a z interval instead"], a:2, w:"With n < 30, the sample must show no strong skew or outliers. Here it does, so the t procedure is not appropriate."},
  {t:"7.8", s:"Two independent samples: n₁ = 30, x̄₁ = 72, s₁ = 8; n₂ = 40, x̄₂ = 68, s₂ = 10. The standard error of x̄₁ − x̄₂ is", o:["√(8/30 + 10/40)","√(64/30 + 100/40)","8/√30 + 10/√40","√(64 + 100)"], a:1, w:"SE = √(s₁²/n₁ + s₂²/n₂) = √(64/30 + 100/40) ≈ 2.15."},
  {t:"7.5", s:"A one-sided t test with df = 20 gives t = 2.10. The P-value is between", o:["0.01 and 0.02","0.02 and 0.025","0.025 and 0.05","0.05 and 0.10"], a:1, w:"From Table B with df = 20: t = 2.086 ↔ 0.025 and t = 2.197 ↔ 0.02, so 0.02 < P < 0.025."},
  {t:"7.10", s:"Researchers compare the proportion of men and women who own a pet. The appropriate procedure is", o:["two-sample t test","paired t test","two-proportion z test","one-sample t test"], a:2, w:"Pet ownership is categorical and there are two independent groups, so compare proportions."},
  {t:"7.3", s:"Which correctly interprets a 90% confidence interval (12.1, 14.3) for the mean commute time (minutes) of a city's workers?", o:["90% of workers commute between 12.1 and 14.3 minutes","We are 90% confident the interval 12.1 to 14.3 minutes captures the mean commute time of all workers in the city","There is a 90% chance the mean is between 12.1 and 14.3","The sample mean is between 12.1 and 14.3 with probability 0.9"], a:1, w:"The interval estimates the population mean; the confidence is in the method."},
  {t:"7.9", s:"A 95% two-sample t interval for μ₁ − μ₂ is (1.2, 5.8). Which conclusion is appropriate?", o:["There is no significant difference","μ₁ is likely larger than μ₂ by somewhere between 1.2 and 5.8 units","μ₂ is larger than μ₁","The samples were paired"], a:1, w:"The interval lies entirely above 0, so the difference μ₁ − μ₂ is plausibly positive."}
 ],
 frq:{title:"Paired t test", prompt:["A coach wants to know whether a six-week training program improves 40-yard dash times. Ten athletes are timed before and after. Differences (before − after, in seconds): 0.12, 0.08, −0.03, 0.15, 0.10, 0.05, 0.20, 0.02, 0.09, 0.07. Mean difference 0.085, SD 0.065. A dotplot of the differences shows no outliers or strong skew.","(a) Why is a paired procedure appropriate?","(b) Carry out a test at α = 0.05 of whether the program reduces dash times.","(c) Can the coach conclude the program caused the improvement? Explain."],
  model:["(a) Each athlete produced two times (before and after), so the measurements are not independent. The differences for each athlete form one sample.","(b) State: H₀: μ_d = 0, Hₐ: μ_d > 0, where μ_d is the true mean decrease (before − after) in dash time. Plan: paired t test. Random: assume the athletes are a random sample or random order (if not, note the limit). Normal/Large Sample: n = 10 is small, but the dotplot of differences shows no outliers or strong skew. Do: t = 0.085/(0.065/√10) ≈ 4.14, df = 9, P-value ≈ 0.0013. Conclude: 0.0013 < 0.05, reject H₀. There is convincing evidence the program reduces mean dash time for athletes like these.","(c) Not strictly. There was no control group and no random assignment, so improvement could come from other factors such as practice over six weeks or natural development. The data show a decrease, not that the program caused it."],
  rubric:["(a) two measurements on the same unit → differences.","(b) four steps; the shape justification for n = 10 must cite the graph.","(c) no comparison group/random assignment → no causal claim."]}
},
{id:8, name:"Inference for Categorical Data: Chi-Square", short:"Inference: Chi-Square", weight:"2–5%", wmid:3.5,
 hol:"Expected in Hollinger's spring semester. Small weight on the exam, but one FRQ often uses a two-way table.",
 big:"Chi-square compares observed counts to expected counts. Goodness of fit tests one categorical variable against a claimed distribution; homogeneity compares groups; independence tests association in one sample.",
 lessons:[
  {n:"8.1–8.3", t:"Goodness of fit", info:"H₀: the distribution of the categorical variable matches the claimed proportions. Expected count = n × pᵢ. χ² = Σ (O − E)²/E, df = categories − 1. Conditions: random, 10%, all expected counts ≥ 5.", key:"Expected counts, not observed, must be at least 5."},
  {n:"8.4–8.5", t:"Homogeneity", info:"Separate random samples from several populations (or treatment groups), one categorical variable. H₀: the distribution is the same in every population. Expected count = (row total × column total)/grand total; df = (rows − 1)(columns − 1).", key:"Multiple samples or treatment groups → homogeneity."},
  {n:"8.6", t:"Independence", info:"One random sample, two categorical variables. H₀: no association between the variables. Same expected counts and df as homogeneity; the difference is the design and the wording of the conclusion.", key:"One sample, two variables → independence."},
  {n:"8.7", t:"Follow-up analysis", info:"When χ² is significant, find the cells contributing most to the statistic (largest (O − E)²/E) and compare observed to expected to describe the nature of the difference or association.", key:"Say which categories were higher or lower than expected."}
 ],
 formulas:["χ² = Σ (Observed − Expected)² / Expected","GOF: Expected = n·pᵢ, df = k − 1","Two-way table: Expected = (row total)(column total)/n, df = (r − 1)(c − 1)"],
 traps:["Chi-square tests are always right-tailed: the P-value is the area above the statistic.","Homogeneity vs independence depends on how the data were collected, not on the table's shape.","Do not use percentages in the formula; use counts.","The large expected count condition is about expected counts, each ≥ 5."],
 mcq:[
  {t:"8.1", s:"A die is rolled 120 times to test whether it is fair. The expected count for each face is", o:["6","20","120","depends on the observed data"], a:1, w:"Expected = n × p = 120 × 1/6 = 20 for each of the six faces."},
  {t:"8.2", s:"For the fair-die test with six faces, the degrees of freedom are", o:["119","6","5","1"], a:2, w:"Goodness of fit df = number of categories − 1 = 5."},
  {t:"8.3", s:"A goodness-of-fit test gives χ² = 11.2 with df = 5. Using Table C, the P-value is", o:["less than 0.01","between 0.025 and 0.05","between 0.05 and 0.10","greater than 0.10"], a:1, w:"For df = 5, 11.07 ↔ 0.05 and 12.83 ↔ 0.025, so 0.025 < P < 0.05."},
  {t:"8.5", s:"A two-way table has 3 rows and 4 columns. The degrees of freedom for a chi-square test are", o:["12","11","6","7"], a:2, w:"df = (3 − 1)(4 − 1) = 6."},
  {t:"8.6", s:"One random sample of 500 adults is classified by age group and preferred news source. The appropriate test is", o:["chi-square goodness of fit","chi-square test for homogeneity","chi-square test for independence","two-proportion z test"], a:2, w:"One sample, two categorical variables: test for independence (association)."},
  {t:"8.4", s:"Separate random samples of 200 teens, 200 adults, and 200 seniors are each asked their favorite streaming service. The appropriate test is", o:["goodness of fit","homogeneity","independence","one-sample t"], a:1, w:"Three separate samples, one categorical variable: homogeneity of distributions."},
  {t:"8.5", s:"In a two-way table, the row total is 80, the column total is 150, and the grand total is 400. The expected count for that cell is", o:["30","230","0.075","53.3"], a:0, w:"Expected = (80 × 150)/400 = 30."},
  {t:"8.1", s:"Which condition must be checked for every chi-square test?", o:["All observed counts at least 10","All expected counts at least 5","The population is normal","n ≥ 30"], a:1, w:"Chi-square approximations rely on expected counts of at least 5 in every cell."},
  {t:"8.7", s:"A chi-square test for independence rejects H₀. The correct conclusion is", o:["the two variables are independent","there is convincing evidence of an association between the two variables in the population","one variable causes the other","the sample was biased"], a:1, w:"Rejecting 'no association' gives evidence of association. Causation is never established by an observational chi-square test."},
  {t:"8.2", s:"A cell has observed count 36 and expected count 30. Its contribution to χ² is", o:["6","1.2","0.2","36"], a:1, w:"(36 − 30)²/30 = 36/30 = 1.2."}
 ],
 frq:{title:"Chi-square test for homogeneity", prompt:["A school randomly samples 100 freshmen and 100 seniors and asks how they get to school. Freshmen: Bus 40, Car 45, Walk 15. Seniors: Bus 20, Car 65, Walk 15. Do the data provide convincing evidence that the distribution of transportation differs between freshmen and seniors? Use α = 0.05."],
  model:["State: H₀: the distribution of transportation method is the same for freshmen and seniors. Hₐ: the distributions differ.","Plan: chi-square test for homogeneity. Random: two random samples. 10%: 100 is less than 10% of each class (reasonable if each class has at least 1,000 students; otherwise note the limitation). Large Counts: expected counts are Bus 30, Car 55, Walk 15 for each grade, all ≥ 5.","Do: χ² = (40−30)²/30 + (45−55)²/55 + (15−15)²/15 + (20−30)²/30 + (65−55)²/55 + 0 = 3.33 + 1.82 + 0 + 3.33 + 1.82 + 0 = 10.30. df = (2−1)(3−1) = 2. P-value ≈ 0.006.","Conclude: 0.006 < 0.05, reject H₀. There is convincing evidence that the distribution of transportation method differs between freshmen and seniors. Follow-up: freshmen ride the bus more than expected and seniors drive more than expected."],
  rubric:["State: hypotheses about distributions, in context.","Plan: name the test; expected counts shown and compared to 5.","Do: statistic, df, P-value.","Conclude: decision plus context; a sentence on which cells drove the result earns the follow-up credit."]}
},
{id:9, name:"Inference for Quantitative Data: Slopes", short:"Inference: Slopes", weight:"2–5%", wmid:3.5,
 hol:"Expected at the end of Hollinger's spring semester, right before AP review. Builds directly on Unit 2 regression.",
 big:"The sample slope b estimates the population slope β. Inference uses t with n − 2 degrees of freedom and the slope's standard error read straight from computer output.",
 lessons:[
  {n:"9.1", t:"Sampling distribution of a slope", info:"Different samples give different least-squares lines. Under the model, the sampling distribution of b is centered at β with standard deviation σ_b, estimated by SE_b from the output.", key:"The 'SE Coef' next to the x-variable row is SE_b."},
  {n:"9.2–9.3", t:"Confidence interval for a slope", info:"b ± t*·SE_b, df = n − 2. Conditions (LINER): Linear pattern, Independent observations (random, 10%), Normal residuals, Equal variance of residuals across x, Random.", key:"Check linearity and equal SD with the residual plot; normality with a histogram or plot of residuals."},
  {n:"9.4–9.5", t:"Test for a slope", info:"H₀: β = 0 (no linear relationship). t = (b − 0)/SE_b, df = n − 2. Computer output usually prints this t and a two-sided P-value; halve it for a one-sided alternative.", key:"The 'T' and 'P' columns on the x row ARE the slope test."},
  {n:"9.6", t:"Reading computer output", info:"Predictor | Coef | SE Coef | T | P. Constant row gives a; the x row gives b, SE_b, t, P. S is the residual SD; R-Sq is r². Interpret every number in context.", key:"Degrees of freedom = n − 2 because two parameters (a and b) were estimated."}
 ],
 formulas:["Slope interval: b ± t*·SE_b, df = n − 2","Slope test: t = (b − β₀)/SE_b, usually β₀ = 0","SE_b = s / (sₓ√(n − 1)), where s is the residual SD"],
 traps:["df is n − 2, not n − 1.","Software P-values are two-sided; a one-sided alternative uses half.","Interpret the interval about the SLOPE: 'the true change in predicted y per unit x is between ...'.","A significant slope does not prove causation unless the data came from a randomized experiment."],
 mcq:[
  {t:"9.6", s:"Regression output for predicting weight (lb) from height (in) on 30 adults: Constant −190.5 (SE 24.1); Height 5.20 (SE 0.62); S = 11.3; R-Sq = 71.5%. The test statistic for H₀: β = 0 is", o:["5.20/0.62 ≈ 8.39","−190.5/24.1","0.62/5.20","5.20/11.3"], a:0, w:"t = b/SE_b = 5.20/0.62 ≈ 8.39 with df = 28."},
  {t:"9.2", s:"A regression predicting weight from height is fit on 30 adults. A 95% confidence interval for the slope uses degrees of freedom", o:["30","29","28","2"], a:2, w:"df = n − 2 = 28 because both the intercept and slope were estimated."},
  {t:"9.2", s:"A regression of weight (lb) on height (in) for 30 adults gives slope 5.20 with SE 0.62. With t* ≈ 2.048 for 28 df, the 95% confidence interval for the slope is approximately", o:["5.20 ± 0.62","5.20 ± 1.27","5.20 ± 2.05","−190.5 ± 49.4"], a:1, w:"ME = 2.048 × 0.62 ≈ 1.27, so (3.93, 6.47)."},
  {t:"9.3", s:"A 95% confidence interval for the slope of a regression of weight (lb) on height (in) for adults is (3.93, 6.47). Which is a correct interpretation?", o:["95% of adults gain between 3.93 and 6.47 lb per inch","We are 95% confident that the true slope relating weight to height for all adults is between 3.93 and 6.47 lb per inch","There is a 95% chance a person 1 inch taller weighs 3.93 to 6.47 lb more","The correlation is between 3.93 and 6.47"], a:1, w:"The interval estimates the population slope β, in units of y per unit of x."},
  {t:"9.4", s:"In a slope test, the output shows P = 0.000 for the x row. The conclusion is", o:["there is no linear relationship","there is convincing evidence of a linear relationship between the variables in the population","the intercept is zero","r = 1"], a:1, w:"A tiny P-value rejects H₀: β = 0, giving evidence that the true slope is not zero."},
  {t:"9.2", s:"Which condition for slope inference is checked with a residual plot showing roughly constant vertical spread?", o:["Linear","Independent","Normal","Equal variance"], a:3, w:"Equal SD of residuals across all x-values appears as a residual plot with even spread, no fan shape."},

(function(){

  const U3 = {id:3, name:"Probability", short:"Probability", weight:"part of 10–20%", wmid:8, ced:"CED Unit 4 (first half)",

    traps:["Disjoint and independent are different ideas. Disjoint: cannot both happen. Independent: one does not change the other's probability. Disjoint events with nonzero probability are never independent.","P(A | B) and P(B | A) are different numbers. Read 'given' carefully.","'At least one' is 1 − P(none).","A simulation answer must say how digits map to outcomes, what one trial is, what you record, and how many trials."],

  U3.frqs = [
   {title:"Two-way table and conditional probability", prompt:["A high school surveyed all 400 students about whether they have a part-time job and whether they play a school sport. Results: 90 students have a job and play a sport; 110 have a job and do not play a sport; 120 have no job and play a sport; 80 have neither.","(a) Find the probability that a randomly selected student has a part-time job.","(b) Find the probability that a randomly selected student plays a sport, given that the student has a part-time job.","(c) Are the events 'has a job' and 'plays a sport' independent? Justify with probabilities.","(d) Find the probability that a randomly selected student has a job or plays a sport."],
    model:["(a) P(job) = (90 + 110)/400 = 200/400 = 0.50.","(b) P(sport | job) = 90/200 = 0.45.","(c) P(sport) = (90 + 120)/400 = 0.525. Since P(sport | job) = 0.45 ≠ P(sport) = 0.525, the events are not independent. Students with jobs are less likely to play a sport.","(d) P(job or sport) = P(job) + P(sport) − P(both) = 0.50 + 0.525 − 0.225 = 0.80. Or 1 − P(neither) = 1 − 80/400 = 0.80."],
    rubric:["(a) and (b): correct fraction with the right denominator. For (b) the denominator is the 200 students with jobs, not 400.","(c) must compare two probabilities and state the conclusion. 'They overlap so they are not independent' earns nothing.","(d) the addition rule with the overlap subtracted, or the complement of 'neither'."]},
   {title:"Tree diagram and a reverse conditional", prompt:["A factory gets 60% of its parts from supplier A and 40% from supplier B. 3% of A's parts are defective and 8% of B's parts are defective. A part is selected at random.","(a) Draw or describe a tree diagram for this situation and find the probability that the selected part is defective.","(b) Given that the selected part is defective, find the probability it came from supplier B.","(c) Two parts are selected at random. Find the probability that at least one is defective. State an assumption you made."],
    model:["(a) Branches: A (0.60) → defective (0.03) / not (0.97); B (0.40) → defective (0.08) / not (0.92). P(defective) = 0.60(0.03) + 0.40(0.08) = 0.018 + 0.032 = 0.050.","(b) P(B | defective) = P(B and defective)/P(defective) = 0.032/0.050 = 0.64. Although B supplies fewer parts, it supplies most of the defective ones.","(c) P(at least one defective) = 1 − P(neither) = 1 − (0.95)² = 1 − 0.9025 = 0.0975, assuming the two parts' conditions are independent (reasonable if the factory stock is large relative to 2)."],
    rubric:["(a) show both products and their sum.","(b) the joint probability over the total probability of the condition, with the numbers.","(c) the complement approach and the independence assumption named."]},
   {title:"Designing a simulation", prompt:["A cereal company puts one of 5 different prizes, equally likely, in each box. Maya wants to estimate the probability that she gets all 5 prizes if she buys 10 boxes.","(a) Describe how to use a random digit table to simulate buying 10 boxes.","(b) Explain how to use many trials of the simulation to estimate the probability.","(c) Maya runs 200 trials and gets all 5 prizes in 64 of them. Estimate the probability and interpret it in context.","(d) Is the probability of a specific prize in a box affected by what was in the previous box? Explain how this affects the simulation design."],
    model:["(a) Let digits 1–5 represent the five prizes and ignore 0, 6, 7, 8, 9. Read 10 usable digits from the table; each digit is the prize in one box. Record whether all five digits 1–5 appear among the 10.","(b) Repeat the 10-box trial many times (say 1,000). The estimated probability is the number of trials with all five prizes divided by the number of trials.","(c) 64/200 = 0.32. If Maya repeatedly bought 10 boxes, she would get all five prizes in about 32% of those purchases, in the long run.","(d) No; boxes are filled independently, so each box's prize does not depend on the previous one. That is why each digit is read independently and digits may repeat within a trial."],
    rubric:["(a) three parts: digit assignment with ignored digits, what one trial is (10 digits), what gets recorded.","(b) repeat many times, proportion of trials.","(c) the estimate and a long-run interpretation in context.","(d) independence stated and connected to allowing repeats."]}

  // ---- Unit 4: Random Variables (second half of CED Unit 4) ----
  const U4 = {id:4, name:"Random Variables", short:"Random Variables", weight:"part of 10–20%", wmid:8, ced:"CED Unit 4 (second half)",

    big:"A random variable has a distribution with a mean and a standard deviation. Compute them the way the formula sheet shows, combine independent variables by adding variances, and know when a count is binomial and when a normal model applies.",

    traps:["When combining variables, add variances only if the variables are independent, and add them even for X − Y. Standard deviations never add.","Expected value is a long-run average, not what you expect on one trial.","Binomial 'at least 3' is 1 − binomcdf(n, p, 2).","A normal calculation earns full credit only with the model named, a shaded sketch or z-score, and the probability."],

  U4.frqs = [
   O4.frq,
   {title:"Discrete random variable, mean and standard deviation", prompt:["A food truck sells combo meals. The number of combos X a randomly selected customer buys has the distribution: P(X=0) = 0.10, P(X=1) = 0.55, P(X=2) = 0.25, P(X=3) = 0.10.","(a) Calculate and interpret the mean of X.","(b) Calculate the standard deviation of X.","(c) Each combo costs $9 and the truck charges a flat $2 service fee per customer. Let T be the total a customer pays. Find the mean and standard deviation of T.","(d) Two customers are selected independently. Find the probability that together they buy exactly 1 combo."],
    model:["(a) μₓ = 0(0.10) + 1(0.55) + 2(0.25) + 3(0.10) = 1.35 combos. If many customers were observed, the average number of combos per customer would be about 1.35 in the long run.","(b) σ²ₓ = (0−1.35)²(0.10) + (1−1.35)²(0.55) + (2−1.35)²(0.25) + (3−1.35)²(0.10) = 0.182 + 0.067 + 0.106 + 0.272 = 0.627. σₓ = √0.627 ≈ 0.79 combos.","(c) T = 2 + 9X. μ_T = 2 + 9(1.35) = $14.15. σ_T = 9(0.79) ≈ $7.13. The fee shifts the mean but not the spread.","(d) Exactly 1 combo total: (0 then 1) or (1 then 0) = 0.10(0.55) + 0.55(0.10) = 0.11."],
    rubric:["(a) the computation AND a long-run interpretation.","(b) show the variance sum before the square root.","(c) adding a constant changes the mean only; multiplying scales the SD by 9.","(d) both orders counted, multiplied because the customers are independent."]},
   {title:"Binomial setting and normal approximation", prompt:["A pharmacy's records show that 20% of flu-shot appointments are no-shows. On a given day 15 appointments are booked. Assume appointments are independent.","(a) Let X be the number of no-shows. Explain why X is a binomial random variable and give its parameters.","(b) Find the probability that exactly 3 appointments are no-shows.","(c) Find the probability that at least 5 are no-shows.","(d) Calculate the mean and standard deviation of X and interpret the mean.","(e) On a busy week the pharmacy books 200 appointments. Is it appropriate to use a normal model for the number of no-shows? Justify, then find the approximate probability of more than 50 no-shows."],
    model:["(a) Binary (no-show or not), Independent (stated), fixed Number n = 15, Same probability p = 0.20. X is binomial with n = 15, p = 0.20.","(b) P(X = 3) = C(15,3)(0.2)³(0.8)¹² = 455(0.008)(0.0687) ≈ 0.250. binompdf(15, 0.2, 3) ≈ 0.2501.","(c) P(X ≥ 5) = 1 − P(X ≤ 4) = 1 − binomcdf(15, 0.2, 4) ≈ 1 − 0.8358 = 0.164.","(d) μ = np = 3 no-shows; σ = √(15·0.2·0.8) = √2.4 ≈ 1.55. Over many days with 15 appointments, the average number of no-shows would be about 3 per day.","(e) np = 40 ≥ 10 and n(1−p) = 160 ≥ 10, so the Large Counts condition is met. μ = 40, σ = √(200·0.2·0.8) = √32 ≈ 5.66. z = (50 − 40)/5.66 ≈ 1.77. P(X > 50) ≈ P(Z > 1.77) ≈ 0.038."],

   {title:"Sampling design and bias", prompt:["A city wants to estimate the proportion of its 40,000 households that would support a new recycling fee. A council member suggests posting the question on the city's social media page and counting the responses. A second proposal is to mail a survey to a random sample of 800 households drawn from the property tax list.","(a) Identify the type of bias in the council member's plan and explain the direction of the bias.","(b) The mailed survey gets 310 responses. Name the type of bias this introduces and explain how it could affect the estimate.","(c) Describe how to select the 800 households using a stratified random sample with neighborhoods as strata, and explain one advantage over a simple random sample.","(d) The city instead randomly selects 20 of its 400 city blocks and surveys every household on those blocks. Name this sampling method and give one reason the city might choose it."],
    model:["(a) Voluntary response bias: people choose whether to respond, and those with strong feelings (likely opposition to a fee) are more likely to answer. The estimate of support would be too low.","(b) Nonresponse bias. Households that did not return the survey may differ from those that did (for example, renters or busy households), so the estimate may not represent all households.","(c) Group the 40,000 households by neighborhood. Within each neighborhood, number the households and use a random number generator to select a number proportional to its size, ignoring repeats, until 800 are chosen in total. Because support likely differs by neighborhood, guaranteeing every neighborhood is represented reduces variability in the estimate.","(d) Cluster sampling. It is cheaper and faster to visit whole blocks than 800 scattered households."],
    rubric:["(a) type AND direction with a mechanism.","(b) nonresponse, and how responders might differ.","(c) strata named, SRS within each, and 'reduces variability' as the advantage.","(d) cluster, with a cost or convenience reason."]},
   {title:"Observational study, confounding, and scope", prompt:["A researcher reviews records of 2,000 adults and finds that those who drink at least two cups of coffee a day have a lower rate of type 2 diabetes than those who drink less.","(a) Is this an observational study or an experiment? Explain.","(b) Identify the explanatory and response variables.","(c) Describe a confounding variable and explain how it could account for the association.","(d) Can the researcher conclude that drinking coffee lowers the risk of diabetes? To what population can the results be generalized? Explain both.","(e) Describe how an experiment could be designed to test whether coffee reduces diabetes risk, including how you would assign treatments."],
    model:["(a) Observational. The researcher only recorded coffee habits and diabetes status; no treatment was imposed.","(b) Explanatory: daily coffee consumption (at least 2 cups or less). Response: whether the adult has type 2 diabetes.","(c) Exercise level. Adults who exercise more may also drink more coffee, and exercise lowers diabetes risk, so the effect of coffee cannot be separated from the effect of exercise.","(d) No causal conclusion: there was no random assignment, so confounding variables could explain the association. Generalization: only if the 2,000 records were a random sample of some population; otherwise only to adults similar to those in the records.","(e) Recruit volunteers without diabetes. Number them and use a random number generator to assign half to drink two cups of coffee daily and half to drink none (or a caffeine-free substitute), ignoring repeats. Follow both groups for several years and compare the proportion who develop diabetes. Random assignment balances variables like exercise between the groups."],

   {title:"Transformations and z-scores", prompt:["The times, in seconds, for 40 students to solve a puzzle have a mean of 95 seconds and a standard deviation of 18 seconds. The distribution is roughly symmetric with no outliers.","(a) A student solved the puzzle in 68 seconds. Calculate and interpret this student's z-score.","(b) The teacher decides to report times in minutes instead of seconds. Find the mean and standard deviation of the times in minutes.","(c) The teacher then subtracts 0.5 minutes from everyone's time to account for reading the instructions. What happens to the mean, the standard deviation, and the shape of the distribution?","(d) Suppose the times were approximately normal. Estimate the percent of students who took longer than 131 seconds."],
    model:["(a) z = (68 − 95)/18 = −1.5. This student's time was 1.5 standard deviations below the mean, meaning faster than typical.","(b) Dividing by 60: mean = 95/60 ≈ 1.58 minutes; SD = 18/60 = 0.30 minutes.","(c) The mean decreases by 0.5 to about 1.08 minutes. The standard deviation stays 0.30 minutes. The shape is unchanged.","(d) 131 = 95 + 2(18), two SDs above the mean. By the Empirical Rule about 2.5% took longer."],

   {title:"Boxplots and outliers", prompt:["The number of text messages sent in a day by a random sample of 20 students has five-number summary: min 12, Q1 35, median 58, Q3 90, max 240.","(a) Determine whether 240 is an outlier using the 1.5 × IQR rule. Show your work.","(b) Describe the shape of the distribution based on the five-number summary and explain your reasoning.","(c) Which measure of center, the mean or the median, would be larger for these data? Explain.","(d) The student who sent 240 messages is removed from the data set. Describe the effect on the median and on the standard deviation."],

   {title:"Sampling distribution of a mean", prompt:["The weights of bags of trail mix produced by a machine are approximately normal with mean 16.1 ounces and standard deviation 0.4 ounces. Quality control takes a random sample of 16 bags each hour.","(a) Find the probability that one randomly selected bag weighs less than 15.9 ounces.","(b) Describe the sampling distribution of the sample mean weight for samples of 16 bags.","(c) Find the probability that the sample mean weight is less than 15.9 ounces.","(d) Explain why the answers to (a) and (c) differ.","(e) If the machine drifts so that bags are no longer normally distributed, is the normal model for the sample mean still appropriate for n = 16? Explain."],
    model:["(a) z = (15.9 − 16.1)/0.4 = −0.5. P(X < 15.9) = P(Z < −0.5) ≈ 0.309.","(b) Center: μ(x̄) = 16.1 oz. Spread: σ(x̄) = 0.4/√16 = 0.1 oz (16 bags is less than 10% of all bags). Shape: normal, because the population of bag weights is normal.","(c) z = (15.9 − 16.1)/0.1 = −2. P(x̄ < 15.9) = P(Z < −2) ≈ 0.023.","(d) Sample means vary less than individual bags: the SD of x̄ is σ/√n, four times smaller, so 15.9 is two SDs below the mean for a sample mean but only half an SD below for one bag.","(e) Not necessarily. With n = 16 < 30, the Central Limit Theorem does not guarantee approximate normality; we would need to look at the sample data for strong skew or outliers."],
    rubric:["(a) and (c) z-scores shown with the correct SD in each.","(b) three parts with numbers and the reason for the shape.","(d) the σ/√n idea in words.","(e) n < 30 and what you would need instead."]},
   {title:"Bias, variability, and sample size", prompt:["A statistics class simulates taking many random samples of size n from a population in which 30% of voters support a candidate. For n = 25, the simulated sample proportions have a histogram centered at 0.30 with most values between 0.12 and 0.48. For n = 100, the histogram is centered at 0.30 with most values between 0.21 and 0.39.","(a) Is the sample proportion an unbiased estimator of the population proportion? Use the simulation to justify.","(b) Explain the difference between the two histograms and why it occurs, using the formula for the standard deviation of p̂.","(c) Verify that the spread of the n = 100 histogram agrees with the theoretical standard deviation.","(d) A student says that sampling from a population of 50,000 voters instead of 5,000 would change the spread. Is the student correct? Explain."],
    model:["(a) Yes. Both histograms are centered at 0.30, the true proportion, so the mean of the sampling distribution equals the parameter.","(b) The n = 100 histogram is narrower. σ(p̂) = √(p(1−p)/n) decreases as n increases; quadrupling n halves the standard deviation, which matches the ranges shrinking from ±0.18 to ±0.09.","(c) √(0.30·0.70/100) = √0.0021 ≈ 0.046. Two SDs ≈ 0.092, matching 'most values between 0.21 and 0.39'.","(d) No. As long as the sample is less than 10% of the population, the population size does not affect the standard deviation of p̂; only the sample size does."],
    rubric:["(a) 'centered at the parameter' = unbiased.","(b) the formula and the √n relationship.","(c) the computation and the match to the histogram.","(d) the 10% condition idea."]}

  const U6 = Object.assign({}, O6, {ced:"CED Unit 6"});
  U6.frqs = [
   O6.frq,
   {title:"Confidence interval for a proportion", prompt:["A random sample of 500 adults in a state found that 285 support a ballot measure.","(a) Construct and interpret a 95% confidence interval for the proportion of all adults in the state who support the measure. Check conditions.","(b) Interpret the confidence level of 95%.","(c) A news report claims that a majority of adults support the measure. Does the interval support this claim? Explain.","(d) How large a sample would be needed to estimate the proportion to within 0.02 with 95% confidence? Use the sample proportion from this study."],
    model:["(a) Conditions: random sample; 500 < 10% of adults in the state; successes 285 ≥ 10 and failures 215 ≥ 10. p̂ = 0.57. SE = √(0.57·0.43/500) ≈ 0.0221. Interval: 0.57 ± 1.96(0.0221) = 0.57 ± 0.043 = (0.527, 0.613). We are 95% confident the interval from 0.527 to 0.613 captures the true proportion of adults in the state who support the measure.","(b) If we took many random samples of 500 adults and built a 95% interval from each, about 95% of those intervals would capture the true proportion of supporters.","(c) Yes. Every value in the interval is above 0.50, so a majority is plausible and 50% or less is not.","(d) 1.96·√(0.57·0.43/n) ≤ 0.02 → n ≥ (1.96/0.02)²(0.57)(0.43) ≈ 2,354.3, so at least 2,355 adults."],
    rubric:["(a) three conditions with numbers, correct interval, interpretation with 'true proportion' and context.","(b) the long-run method interpretation, not a probability about this interval.","(c) 'entire interval above 0.50'.","(d) solve the inequality and round up."]},
   {title:"Two-proportion z test", prompt:["A school tests whether a new tutoring program changes the pass rate on a math exam. Of 180 randomly selected students assigned to tutoring, 135 passed. Of 180 randomly selected students not assigned to tutoring, 117 passed.","(a) State the hypotheses for a test of whether the pass rates differ.","(b) Check conditions for a two-sample z test.","(c) Calculate the test statistic and P-value.","(d) State a conclusion at α = 0.05 in context.","(e) Describe a Type I error in this context and one consequence of it."],
    model:["(a) H₀: p₁ = p₂, Hₐ: p₁ ≠ p₂, where p₁ and p₂ are the true pass rates for students with and without tutoring.","(b) Random: both groups randomly selected/assigned. 10%: each 180 is less than 10% of the school's students (if the school has 1,800+; otherwise note it). Large Counts: 135, 45, 117, 63 all ≥ 10.","(c) p̂₁ = 0.75, p̂₂ = 0.65, pooled p̂c = 252/360 = 0.70. SE = √(0.70·0.30·(1/180 + 1/180)) ≈ 0.0483. z = (0.75 − 0.65)/0.0483 ≈ 2.07. Two-sided P-value ≈ 2(0.0192) = 0.038.","(d) Because 0.038 < 0.05, reject H₀. There is convincing evidence that the pass rate differs between students who receive tutoring and those who do not; the tutored group passed at a higher rate.","(e) Concluding the tutoring program changes the pass rate when it actually does not. The school might spend money expanding a program that has no effect."],
    rubric:["(a) parameters defined in context.","(b) all three, with the four counts listed.","(c) pooled proportion used in the SE; z and P.","(d) decision, then evidence sentence about the alternative.","(e) 'reject a true H₀' in context plus a consequence."]}
  ];

   O7.frq,
   {title:"One-sample t interval", prompt:["A random sample of 20 commutes by a city employee has mean 34.2 minutes and standard deviation 6.5 minutes. A dotplot of the 20 commutes is roughly symmetric with no outliers.","(a) Check the conditions for constructing a t interval for the mean commute time.","(b) Construct and interpret a 90% confidence interval for the employee's true mean commute time.","(c) The employee claims the mean commute is 30 minutes. Based on the interval, is this claim plausible? Explain.","(d) Explain how the interval would change if the confidence level were raised to 99%, and why."],
    model:["(a) Random: random sample of commutes. 10%: 20 is less than 10% of all the employee's commutes. Normal/Large Sample: n = 20 < 30, but the dotplot shows no strong skew or outliers, so a t procedure is appropriate.","(b) df = 19, t* = 1.729. 34.2 ± 1.729(6.5/√20) = 34.2 ± 2.51 = (31.7, 36.7). We are 90% confident the interval from 31.7 to 36.7 minutes captures the true mean commute time for this employee.","(c) No. 30 minutes is below the interval, so it is not a plausible value for the true mean at this confidence level.","(d) The interval would be wider because t* for 99% (2.861) is larger than for 90%, increasing the margin of error; more confidence requires a wider net."],
    rubric:["(a) the small-n justification must cite the graph.","(b) t* with the correct df, the interval, interpretation about the true mean in context.","(c) outside the interval → not plausible.","(d) wider, with the critical value reason."]},
   {title:"Two-sample t test", prompt:["A researcher wants to know whether a new study app changes exam scores. 32 randomly selected students use the app (mean 78.4, SD 9.1) and 30 randomly selected students do not (mean 73.9, SD 10.2).","(a) State hypotheses for testing whether the mean scores differ.","(b) Verify conditions for a two-sample t test.","(c) Compute the test statistic. Using the conservative degrees of freedom, find the P-value.","(d) Conclude at α = 0.05.","(e) Suppose the students had volunteered for the app group instead of being randomly assigned. How would this change your conclusion?"],
    model:["(a) H₀: μ₁ = μ₂, Hₐ: μ₁ ≠ μ₂, where μ₁ and μ₂ are the true mean exam scores for students using and not using the app.","(b) Random: both samples randomly selected. 10%: each sample is less than 10% of its population. Normal/Large Sample: n₁ = 32 ≥ 30 and n₂ = 30 ≥ 30.","(c) SE = √(9.1²/32 + 10.2²/30) = √(2.588 + 3.468) ≈ 2.46. t = (78.4 − 73.9)/2.46 ≈ 1.83. Conservative df = 29. Two-sided P-value ≈ 0.078 (between 0.05 and 0.10 from Table B).","(d) Since 0.078 > 0.05, fail to reject H₀. There is not convincing evidence that the mean exam score differs between students who use the app and those who do not.","(e) The conclusion about a difference would be the same, but even with a significant result we could not attribute it to the app: without random assignment, students who choose the app may differ in motivation, a confounding variable."],
    rubric:["(a) context for both means.","(b) all three conditions for both groups.","(c) the unpooled SE, t, df = 29, P.","(d) 'fail to reject' and 'not convincing evidence', never 'accept'.","(e) confounding and no causal claim without random assignment."]}
  ];

  // ---- Unit 8 ----
  const U8 = Object.assign({}, O8, {ced:"CED Unit 8"});
  U8.frqs = [
   O8.frq,
   {title:"Goodness of fit", prompt:["A candy company claims its bags contain 30% red, 20% orange, 20% yellow, 15% green, and 15% purple candies. A random sample of 200 candies has 48 red, 46 orange, 42 yellow, 34 green, and 30 purple.","(a) State the hypotheses for a chi-square goodness-of-fit test.","(b) Compute the expected counts and verify the conditions.","(c) Calculate the chi-square statistic and the P-value.","(d) State a conclusion at α = 0.05.","(e) Which color contributes most to the statistic, and in which direction does it differ from the claim?"],
    model:["(a) H₀: the color distribution is 30% red, 20% orange, 20% yellow, 15% green, 15% purple. Hₐ: at least one proportion differs from the claim.","(b) Expected: red 60, orange 40, yellow 40, green 30, purple 30. Random sample; 200 < 10% of all candies; all expected counts ≥ 5.","(c) χ² = (48−60)²/60 + (46−40)²/40 + (42−40)²/40 + (34−30)²/30 + (30−30)²/30 = 2.40 + 0.90 + 0.10 + 0.53 + 0 = 3.93. df = 4. P-value ≈ 0.42.","(d) Since 0.42 > 0.05, fail to reject H₀. There is not convincing evidence that the color distribution differs from the company's claim.","(e) Red contributes the most (2.40). There were fewer red candies than expected (48 vs 60)."],
    rubric:["(a) H₀ lists the claimed proportions; Hₐ 'at least one differs'.","(b) expected counts shown and ≥ 5 checked.","(c) statistic with df and P.","(d) fail to reject, not convincing evidence, in context.","(e) largest component and direction."]},
   {title:"Chi-square test for independence", prompt:["A random sample of 300 adults was asked their age group (18–34, 35–54, 55+) and preferred way to get news (TV, online, print). Observed counts: 18–34: TV 20, online 65, print 15. 35–54: TV 35, online 45, print 20. 55+: TV 50, online 25, print 25.","(a) Which chi-square test is appropriate? Explain your choice.","(b) State the hypotheses.","(c) The expected count for 18–34 and TV is 35. Show how it is computed and state the degrees of freedom.","(d) The test gives χ² = 36.4. Find the P-value and state a conclusion at α = 0.01.","(e) Describe one way the association appears in the data."],
    model:["(a) A test for independence: one random sample of 300 adults, classified by two categorical variables (age group and news source).","(b) H₀: age group and preferred news source are independent (no association) among adults. Hₐ: there is an association.","(c) Row total for 18–34 = 100; column total for TV = 105; expected = (100 × 105)/300 = 35. df = (3 − 1)(3 − 1) = 4.","(d) With df = 4, χ² = 36.4 gives P-value < 0.0005. Since P < 0.01, reject H₀. There is convincing evidence of an association between age group and preferred news source among adults.","(e) Younger adults prefer online news far more than expected (65 observed vs 45 expected), while adults 55+ prefer TV more than expected (50 vs 35)."],
    rubric:["(a) one sample, two variables → independence.","(b) hypotheses about association, in context.","(c) the row × column / total computation and df.","(d) P-value, decision, context.","(e) observed vs expected for a specific cell."]}
  ];

    hol:"Expected to close Hollinger's spring semester before AP review. Scatterplots, correlation and the least-squares line, then inference for the slope using computer output.",
    big:O2.big+" Then the sample slope b estimates the population slope β: t with n − 2 degrees of freedom and the slope's standard error read straight from the output.",
    lessons:O2.lessons.concat(O9.lessons), formulas:O2.formulas.concat(O9.formulas), traps:O2.traps.concat(O9.traps.slice(0,2)),

   {title:"Scatterplot, correlation, and an influential point", prompt:["For 15 used cars of one model, a dealer records age (years) and price (thousands of dollars). The least-squares line is price = 24.6 − 1.85·age with r = −0.91. One car, 2 years old, is listed at $9,000 because of accident damage.","(a) Describe what the scatterplot most likely looks like, using the correlation and the slope.","(b) Interpret the slope and the y-intercept in context. Is the intercept meaningful?","(c) Calculate the residual for the damaged car and explain what its sign means.","(d) If the damaged car is removed, predict how the correlation and the slope would change and why.","(e) A customer asks the dealer to predict the price of a 15-year-old car of this model. Explain why the dealer should be cautious."],
    model:["(a) A fairly strong, negative, roughly linear association between age and price, with one point (the 2-year-old car) far below the line.","(b) Slope: for each additional year of age, the predicted price decreases by $1,850. Intercept: a car that is 0 years old (new) is predicted to cost $24,600. This is close to the data range, so it is plausibly meaningful as a new-car price.","(c) Predicted = 24.6 − 1.85(2) = 20.9 thousand. Residual = 9.0 − 20.9 = −11.9 (thousand dollars). The car sells for $11,900 less than the line predicts; the line over-predicted.","(d) The correlation would become stronger (closer to −1) because the point farthest from the pattern is gone. The slope would likely become slightly less steep (closer to 0 in magnitude) or change little, since the point is near the center of the x-values and mainly pulled the line down rather than tilting it.","(e) 15 years is far outside the ages in the data, so this would be extrapolation; the linear pattern may not continue (the line would predict a negative price near 13 years)."],

  let d=''; for(let i=0;i<=40;i++){ const z=-zr+2*zr*i/40; d+=(i?'L':'M')+X(z).toFixed(2)+' '+Y(z).toFixed(2); }

  const r=6, C=2*Math.PI*r, done=share>=1;
  return `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <circle cx="8" cy="8" r="${r}" stroke="var(--line2)" stroke-width="1.5"/>

}

/* mini bell curve for the Units list: gold = share of lessons taught, same equal-area quantiles as Today */
function miniCurve(share, w, h, cls){
  const zmin=-3.1, zmax=3.1, base=h-1, top=1.5, X=z=>1+(z-zmin)/(zmax-zmin)*(w-2), Y=z=>base-Math.exp(-z*z/2)*(base-top);
  const pts=(a,b)=>{ let d=''; for(let i=0;i<=48;i++){ const z=a+(b-a)*i/48; d+=(i?'L':'M')+X(z).toFixed(2)+' '+Y(z).toFixed(2); } return d; };
  const zs = share>=1? zmax : Math.max(zmin, Math.min(zmax, quant(share)));
  return `<svg class="${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true">${share>0?`<path d="${pts(zmin,zs)} L${X(zs).toFixed(2)} ${base} L${X(zmin).toFixed(2)} ${base}Z" fill="var(--gold)"/>`:''}<path d="${pts(zmin,zmax)}" stroke="var(--ink)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M${X(zmin)} ${base}H${X(zmax)}" stroke="var(--ink)" stroke-width="1.25" stroke-linecap="round"/></svg>`;
}

/* ---------- the class calendar, read as data ----------
   A lesson day of unit U is any calendar entry whose lesson text names a section U.x
   ("4.2 Continuous...", "Start Unit 4: ... 4.1 ...", "Unit 2 Quiz and 2.3 ..."). */
const secsOf = (c, u) => [...((c && c.lesson) || '').matchAll(new RegExp('(?:^|[^\\d.])('+u+'\\.\\d+)','g'))].map(m => m[1]);
function unitOf(c){ if(!c) return null; const t = c.lesson || ''; const m = t.match(/(?:^|[^\d.])(\d)\.\d/) || t.match(/Unit (\d)/); return m? +m[1] : null; }
const isLessonDay = c => /(?:^|[^\d.])\d\.\d/.test((c && c.lesson) || '');
const cleanLesson = s => String(s||'').replace(/^Start Unit \d+:\s*[^\d]*?(?=\d+\.\d)/, '');
function unitPlan(id){
  const t = todayISO();
  const les = CAL.filter(c => secsOf(c, id).length).map(c => { const s = secsOf(c, id); return {c, first:s[0], last:s[s.length-1], label:s.join('+')}; });
  const pick = arr => arr.find(c => c.date >= t) || arr[arr.length-1] || null;
  const quiz = pick(CAL.filter(c => c.kind==='quiz' && unitOf(c)===id));
  const test = pick(CAL.filter(c => c.kind==='test' && unitOf(c)===id));
  const taught = les.filter(l => l.c.date < t).length;
  const quizAfter = quiz? les.filter(l => l.c.date <= quiz.date).length : null;
  return {id, les, lessons:les.length, taught, quiz, test, quizAfter, share: les.length? taught/les.length : 0};
}
function currentUnit(){
  const t = todayISO(); let i = CAL.findIndex(c => c.date >= t); if(i < 0) i = CAL.length;
  for(let j=i; j<CAL.length; j++){ const u = unitOf(CAL[j]); if(u) return u; }
  for(let j=Math.min(i, CAL.length)-1; j>=0; j--){ const u = unitOf(CAL[j]); if(u) return u; }
  return 1;
}

  if(d>1 && d<=6) return dt.toLocaleDateString(undefined,{weekday: short? 'short':'long'});
  return dt.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}

const cdf = z => { const t=1/(1+.2316419*Math.abs(z)), d=.3989423*Math.exp(-z*z/2),
  p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0? 1-p : p; };
const quant = p => { if(p<=0) return -9; if(p>=1) return 9; let lo=-6, hi=6; for(let i=0;i<60;i++){ const m=(lo+hi)/2; cdf(m)<p? lo=m : hi=m; } return (lo+hi)/2; };

  const X = z => (cl(z)-zmin)/(zmax-zmin)*W, Y = z => base-Math.exp(-cl(z)*cl(z)/2)*(base-top);
  const pts = (a,b) => { let d=''; for(let i=0;i<=260;i++){ const z=a+(b-a)*i/260; d+=(i?'L':'M')+X(z).toFixed(2)+' '+Y(z).toFixed(2); } return d; };
  const zNow = cl(quant(taught/n)), zNext = cl(quant((taught+1)/n));
  const flagY = Y(0)-16, ink = cssVar('--curve');
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Unit ${p.id} as a normal curve: ${taught} of ${n} lessons taught">
    <defs>

      <pattern id="gmaj" width="${G*5}" height="${G*5}" patternUnits="userSpaceOnUse" y="${base%(G*5)}"><rect width="${G*5}" height="${G*5}" fill="url(#gmin)"/><path d="M0 0H${G*5}M0 0V${G*5}" stroke="${cssVar('--gmaj')}" stroke-width="1" fill="none"/></pattern>
      <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="${cssVar('--tint')}"/><rect width="1.5" height="4" fill="${cssVar('--hatch')}"/></pattern>
