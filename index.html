<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">

<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hollinger Hub</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Hollinger Hub v6. Brief: Charlie's AP Stats companion; one job = "where am I in this unit
   and what do I do next". Feel: calm, exact, studious.
   Benchmarks: Linear (flat surfaces + hairlines, tight display tracking, 4/6/8/12/16 radii)
   and Apple (macOS 26 floating sidebar, 400/600 ladder, one accent).
   Signature: the unit drawn as a normal curve on graph paper; lesson k at the k/n quantile,
   so the gold area IS the share of lessons taught. Gold = data and progress only;
   navy ink = the primary action; pen blue only for focus. Green/red only for right/wrong. */
:root{
  --page:#F6F7F9; --side:#EEF0F4; --paper:#FFFFFF;
  --ink:#13233F; --ink2:#55627A; --ink3:#5F6B82; --mute:#8C96A8;
  --line:rgba(19,35,63,.10); --line2:rgba(19,35,63,.18);
  --pen:#2456D6; --gold:#FFD84A; --hatch:#E8B800; --tint:rgba(255,216,74,.22); --on-gold:#13233F;
  --hover:rgba(19,35,63,.05); --sel:rgba(19,35,63,.08);
  --gmin:rgba(36,86,214,.09); --gmaj:rgba(36,86,214,.18); --curve:#13233F;
  --ok:#1E7F4A; --bad:#C2372C;
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0A1220; --side:#0F1A2D; --paper:#15233B;
    --ink:#EAF0F8; --ink2:#A3AFC4; --ink3:#97A3B9; --mute:#5E6D88;
    --line:rgba(234,240,248,.12); --line2:rgba(234,240,248,.2);
    --pen:#7AA2FF; --gold:#F2CC4A; --hatch:#F2CC4A; --tint:rgba(242,204,74,.34); --on-gold:#0A1220;
    --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09);
    --gmin:rgba(122,162,255,.08); --gmaj:rgba(122,162,255,.17); --curve:rgba(234,240,248,.88);
    --ok:#5BC98A; --bad:#FF7A6E;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--page);color:var(--ink);
  font:400 15px/20px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  letter-spacing:-.24px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;text-align:left}
button:disabled{cursor:default}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}
svg.lucide,.cg{width:16px;height:16px;flex:none}
svg.lucide *,.cg *{vector-effect:non-scaling-stroke}
.serif{font-family:"STIX Two Text",ui-serif,Georgia,serif;letter-spacing:0}
.tab{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- sidebar (macOS 26) ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:8px 0 8px 8px}
.side-in{height:100%;background:var(--side);border-radius:16px;
  box-shadow:0 0 0 .5px var(--line2),0 8px 24px rgba(19,35,63,.06);
  display:flex;flex-direction:column;padding:12px 10px;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;margin-bottom:10px;font-weight:600;font-size:13px;letter-spacing:-.08px}
.brand .mark{width:20px;height:20px;border-radius:6px;background:var(--ink);color:var(--page);display:grid;place-items:center}
.brand .mark .cg{width:14px;height:14px}
@media (prefers-color-scheme: dark){.brand .mark{background:var(--paper);color:var(--ink);box-shadow:0 0 0 .5px var(--line2)}}
.nav{display:flex;flex-direction:column;gap:1px}
.item{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:8px;font-size:13px;letter-spacing:-.08px;transition:background .12s;white-space:nowrap}
.item:hover{background:var(--hover)}
.item.on{background:var(--sel)}
.item .ic{color:var(--ink2);display:grid;place-items:center;width:18px}
.item.on .ic{color:var(--ink)}
.item.cur{font-weight:600}
.item .ct{margin-left:auto;color:var(--ink3);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.grp{display:block;width:100%;font-size:12px;line-height:16px;font-weight:600;color:var(--ink3);padding:16px 8px 6px;border-radius:8px}
.grp:hover,.grp.on{color:var(--ink)}
.ap{margin-top:20px;padding:14px 8px 0;border-top:.5px solid var(--line2)}
.ap b{display:block;font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.08px;font-variant-numeric:tabular-nums}
.ap span{color:var(--ink3);font-size:12px;line-height:16px}

/* ---------- main ---------- */
main{padding:32px 48px 56px;max-width:1120px;width:100%;min-width:0}
.date{color:var(--ink2);font-size:15px}
h1{font-size:34px;line-height:40px;font-weight:600;letter-spacing:-.85px;margin-top:2px}
h2{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.4px}
.h3{font-size:13px;line-height:18px;font-weight:600;color:var(--ink2);letter-spacing:-.08px}
.sub{color:var(--ink2);margin-top:4px;line-height:22px}
.intro{color:var(--ink2);margin-top:8px;line-height:22px;max-width:640px}
.note{color:var(--ink2);font-size:13px;line-height:18px;margin-top:8px}
.measure{max-width:760px}
.back{display:none}
footer{margin-top:56px;color:var(--ink3);font-size:12px;line-height:17px}

/* flat sections: hairline above, no cards */
.sec{margin-top:32px;padding-top:24px;border-top:.5px solid var(--line2)}
.sec.tight{margin-top:24px;padding-top:20px}
.sec > .h3 + *{margin-top:10px}

/* buttons: one filled navy per area, the rest quiet */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:8px;margin-top:18px;
  background:var(--ink);color:var(--page);font-weight:600;letter-spacing:-.24px;white-space:nowrap;transition:opacity .15s,transform .12s,background .12s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.97)}
.btn.sec2{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.btn.sec2:hover{background:var(--hover);opacity:1}
.btn.plain{background:transparent;color:var(--ink2);font-weight:400;padding:0 8px;margin-left:-8px}
.btn.plain:hover{color:var(--ink);opacity:1}
.btn.plain.arm{color:var(--bad)}
.btn:disabled{opacity:.4}
.btns{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px}
.btns .btn{margin-top:0}

/* inset rows (Linear/Apple) */
.list{margin-top:14px}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:8px;transition:background .12s}
.row.two{align-items:flex-start;padding-top:11px;padding-bottom:11px}
button.row:hover{background:var(--hover)}
button.row:hover .ic{color:var(--ink)}
.row + .row::before{content:"";position:absolute;left:8px;right:8px;top:0;border-top:.5px solid var(--line)}
button.row:hover::before,button.row:hover + .row::before{opacity:0}
.row .t{flex:1;min-width:0}
.row .t .s{display:block;color:var(--ink2);font-size:13px;line-height:18px;margin-top:2px}
.row .v{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .ic{color:var(--ink2);display:grid;place-items:center;transition:color .12s}
.row .ic svg.lucide{width:20px;height:20px}
.row .ic.ring svg{width:20px;height:20px}
.row .mini{display:grid;place-items:center;flex:none}
.row .mini .ph{display:none}
.row .t .s.q{font-size:13px;color:var(--ink3);margin-top:0}
.row .chev{color:var(--mute);display:grid;place-items:center}
.row .chev svg.lucide{width:14px;height:14px}
.row .d{width:92px;flex:none;color:var(--ink2);font-variant-numeric:tabular-nums}
.row.two .d{padding-top:1px}
.row.two .ic,.row.two .v,.row.two .chev,.row.two .mini{align-self:center}
.row.past{color:var(--ink3)}
.row.past .t .s{color:var(--mute)}
.row.now{background:var(--sel)}
.row.now::before,.row.now + .row::before{opacity:0}
.row .strong{font-weight:600}
.ap-m{display:none}
.panel:not(#panel-today){max-width:860px}
.l-short{display:none}
.nm-short{display:none}

/* ---------- Today: the curve IS the hero ---------- */
.hero{position:relative;margin-top:22px}
.hero-top{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.num{font-size:112px;line-height:92px;font-weight:400;letter-spacing:-3px;font-feature-settings:"lnum"}
.num i{font-style:italic;font-size:22px;letter-spacing:0;color:var(--ink2);display:block;line-height:28px;margin-bottom:6px}
.read{padding-bottom:6px}
.read b{display:block;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
.read span{color:var(--ink2)}
.plot{margin-top:8px}
@media (min-width:761px){
  .hero{margin-top:18px}
  .hero-top{position:absolute;left:0;top:10px;z-index:1;pointer-events:none;flex-direction:column;align-items:flex-start;gap:10px}
  .read{padding-bottom:0}
  .plot{margin-top:0}
}
.plot svg{display:block;overflow:visible}
.plot text{font:400 13px/1 -apple-system,system-ui,sans-serif;fill:var(--ink2);letter-spacing:-.08px}
.plot .lt{fill:var(--ink);font-weight:600}
.plot .flag{font-weight:600;fill:var(--ink2)}
.plot .today{font:italic 400 15px "STIX Two Text",ui-serif,serif;fill:var(--ink)}
.plot .today,.plot .flag{paint-order:stroke;stroke:var(--page);stroke-width:4px;stroke-linejoin:round}
.foot{color:var(--ink2);font-size:13px;line-height:18px;margin-top:8px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;margin-top:32px;border-top:.5px solid var(--line2)}
.col{padding-top:24px;min-width:0}
.col + .col{border-left:.5px solid var(--line2);padding-left:32px}
.col:first-child{padding-right:32px}
.col .h3 + .list{margin-top:10px}
.col .h3.gap{margin-top:28px}

/* ---------- unit page ---------- */
.stabs{display:flex;gap:24px;margin-top:20px;border-bottom:.5px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{position:relative;height:40px;flex:none;color:var(--ink2);white-space:nowrap;transition:color .12s}
.stabs button:hover{color:var(--ink)}
.stabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
.stabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-.5px;height:2px;border-radius:2px;background:var(--ink)}
.ubody{padding-top:4px}
.lead{font-size:20px;line-height:28px;letter-spacing:-.45px;margin-top:8px;max-width:720px}
.prose p + p{margin-top:10px}
.ul{margin-top:10px;padding-left:18px;max-width:760px}
.ul li{margin-top:6px;line-height:22px}
.ul li::marker{color:var(--mute)}
.ul b{font-weight:600}
.tbl{overflow-x:auto;margin:12px -8px 0;padding:0 8px}
.tbl table{border-collapse:collapse;width:100%;min-width:560px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:10px 16px 10px 0;border-top:.5px solid var(--line);line-height:20px}
.tbl thead th{border-top:0;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2);padding-top:0}
.tbl tbody th{font-weight:600}
.tbl td{color:var(--ink2)}
.defs{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;margin-top:6px}
.defs > div{padding:14px 0;border-top:.5px solid var(--line)}
.defs b{display:block;font-weight:600}
.defs p{color:var(--ink2);margin-top:4px;line-height:20px}
.mem{padding:14px 0;border-top:.5px solid var(--line)}
.mem:first-of-type{border-top:0}
.mem .t{font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.mem .q{font-size:17px;line-height:24px;letter-spacing:-.3px;margin-top:4px}
.les{display:grid;grid-template-columns:76px minmax(0,1fr);column-gap:16px;padding:16px 0;border-top:.5px solid var(--line)}
.les:first-child{border-top:0}
.les .n{font-size:17px;line-height:22px;color:var(--ink2)}
.les h3{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.43px}
.les p{color:var(--ink2);margin-top:4px;line-height:21px}
.les .key{color:var(--ink);font-weight:500;margin-top:8px}
.fx{font-size:17px;line-height:24px}
.term{display:grid;grid-template-columns:220px minmax(0,1fr);column-gap:24px;padding:12px 0;border-top:.5px solid var(--line)}
.term:first-child{border-top:0}
.term .t{font-weight:600}
.term .d{color:var(--ink2);line-height:21px}
.check{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 0;border-top:.5px solid var(--line);line-height:22px}
.check:first-child{border-top:0}
.check .box{width:20px;height:20px;flex:none;margin-top:1px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line2);display:grid;place-items:center;color:transparent;transition:background .12s}
.check .box svg{width:14px;height:14px;stroke-width:2.25}
.check[aria-checked="true"] .box{background:var(--ink);box-shadow:none;color:var(--page)}
.check[aria-checked="true"] .txt{color:var(--ink2)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:var(--hover);box-shadow:inset 0 0 0 .5px var(--line);margin-top:20px;max-width:100%}
.seg button{height:28px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;letter-spacing:-.08px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 0 0 .5px var(--line2),0 1px 2px rgba(19,35,63,.08)}
textarea{display:block;width:100%;min-height:180px;margin-top:18px;padding:12px 14px;border-radius:10px;border:0;
  box-shadow:inset 0 0 0 1px var(--line2);background:var(--paper);color:var(--ink);line-height:22px;resize:vertical}
textarea::placeholder{color:var(--mute)}
textarea:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--pen)}
details{margin-top:16px;border-top:.5px solid var(--line2);border-bottom:.5px solid var(--line2)}
summary{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary .chev{color:var(--mute);display:grid;transition:transform .2s cubic-bezier(.32,.72,0,1)}
details[open] summary .chev{transform:rotate(90deg)}
details .body{padding:0 0 16px}
details .body p + p{margin-top:10px}
.rubric{margin-top:14px}
.rubric div{padding:8px 0;border-top:.5px solid var(--line);color:var(--ink2);line-height:20px}

/* drill */
.dhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:14px;margin-top:20px}
.prog .trk{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .trk i{display:block;height:100%;background:var(--hatch);border-radius:2px;transition:width .3s}
.prog .n{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.prog .btn{margin:0;height:28px;font-size:13px}
.prog .btn.plain{margin:0 -8px 0 0}
.qmeta{display:flex;justify-content:space-between;gap:16px;margin-top:24px;font-size:13px;line-height:18px;color:var(--ink2)}
.qmeta .topic{font-weight:600}
.stem{font-size:20px;line-height:28px;letter-spacing:-.45px;margin-top:6px;max-width:760px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:52px;padding:13px 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line2);line-height:22px;transition:background .12s,box-shadow .12s,color .12s}
.opt:hover{background:var(--hover)}
.opt .k{width:24px;height:24px;flex:none;margin-top:-1px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink2)}
.opt .k svg{width:14px;height:14px;stroke-width:2.25}
.locked .opt{cursor:default}
.locked .opt:hover{background:none}
.locked .opt.dim{color:var(--ink3)}
.opt.pick-right,.opt.reveal{box-shadow:inset 0 0 0 1px var(--ok)}
.opt.pick-right .k,.opt.reveal .k{color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.pick-wrong{box-shadow:inset 0 0 0 1px var(--bad)}
.opt.pick-wrong .k{color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.why{margin-top:20px}
.verdict{display:flex;align-items:center;gap:6px;font-weight:600}
.verdict svg{width:18px;height:18px;stroke-width:2}
.verdict.ok svg{color:var(--ok)}
.verdict.no svg{color:var(--bad)}
.why p{color:var(--ink2);margin-top:6px;line-height:22px}
.score{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:20px}
.score .big{font-size:96px;line-height:80px;letter-spacing:-2px;font-feature-settings:"lnum"}
.score .big small{font-size:32px;letter-spacing:0;color:var(--ink2)}
.missed{padding:16px 0;border-top:.5px solid var(--line)}
.missed:first-of-type{border-top:0}
.missed .h3{margin-bottom:4px}
.missed .a{font-weight:600;margin-top:8px}
.missed p{line-height:22px}
.missed p.w{color:var(--ink2);margin-top:4px}

/* exam */
.calc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;margin-top:18px}
.calc label{display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.calc input{height:40px;width:100%;border:0;border-radius:8px;padding:0 10px;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);
  font-size:17px;font-variant-numeric:tabular-nums;text-align:center;-moz-appearance:textfield}
.calc input::-webkit-inner-spin-button,.calc input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.calc input:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--pen)}
.result{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap;margin-top:24px}
.result .big{font-size:56px;line-height:52px;letter-spacing:-1px;font-feature-settings:"lnum"}
.result .cap{font-size:13px;line-height:18px;color:var(--ink2);margin-top:4px}
.scale{position:relative;margin-top:28px;height:34px}
.scale .trk{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:2px;background:var(--line)}
.scale .fill{position:absolute;left:0;top:20px;height:4px;border-radius:2px;background:var(--hatch);transition:width .25s}
.scale .tick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:14px;color:var(--ink2)}
.scale .tick::after{content:"";display:block;width:1px;height:14px;margin-top:2px;background:var(--line2)}
.scale .tick.hit{color:var(--ink);font-weight:600}
.two-up{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
.two-up > div{min-width:0}
.bars .brow{display:grid;grid-template-columns:minmax(0,1fr) 128px 160px;gap:16px;align-items:center;min-height:44px;border-top:.5px solid var(--line)}
.bars .brow:first-child{border-top:0}
.bars .brow .nm b{font-weight:600;margin-right:10px;font-variant-numeric:tabular-nums}
.bars .brow .pc{color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hatch);border-radius:2px}
.bars.dist .brow{grid-template-columns:40px minmax(0,1fr) 64px}
.bars.dist .brow .sc{font-size:20px}

<script>
// The Hollinger Hub — content. Units follow the College Board CED (2019–) with Mr. Hollinger's class mapping.
const UNITS = [
{id:1, name:"Exploring One-Variable Data", short:"One-Variable Data", weight:"15–23%", wmid:19,
 hol:"Hollinger Unit 1: Analyzing Data (summer assignment + 1.6, 1.7). Tested 9/8.",
 big:"Describe a distribution with SOCS in context: Shape, Outliers, Center, Spread. Choose the summary that matches the shape, and never describe a graph without saying what the variable is.",
 lessons:[
  {n:"1.1–1.2", t:"Variables and categorical data", info:"A variable is categorical (labels) or quantitative (numbers you can average). Categorical data is summarized with frequency and relative-frequency tables, bar graphs, and pie charts. Relative frequency = count ÷ total.", key:"A ZIP code is categorical even though it is made of digits."},
  {n:"1.3–1.4", t:"Displaying quantitative data", info:"Dotplots, stemplots and histograms show shape. Describe shape as symmetric, skewed right (tail to the right), skewed left, uniform, or bimodal, and note gaps and clusters. Histogram bars touch; bar graphs do not.", key:"Skew direction is the direction of the long tail, not the pile."},
  {n:"1.5", t:"Center and spread", info:"Mean is the balance point; median is the middle value. Range, IQR = Q3 − Q1, and standard deviation measure spread. Standard deviation is roughly the typical distance of a value from the mean.", key:"Skewed or outliers → report median and IQR. Symmetric with no outliers → mean and SD."},
  {n:"1.6", t:"Location in a distribution", info:"A percentile is the percent of values at or below a point. A z-score counts standard deviations from the mean: z = (x − mean)/SD. Cumulative relative frequency graphs (ogives) read percentiles.", key:"z = (x − μ)/σ. Negative z means below the mean."},
  {n:"1.7", t:"Linear transformations", info:"Adding a constant shifts every measure of center and location by that amount but leaves spread unchanged. Multiplying by a constant multiplies center and spread by that constant (SD by its absolute value). Shape never changes.", key:"Add: center moves, spread stays. Multiply: both scale."},
  {n:"1.8", t:"Comparing distributions", info:"Compare using the same four features for both groups, with comparative words (higher, more spread out, similar shape). Parallel boxplots and back-to-back stemplots are the standard displays.", key:"\"Group A has a higher median than group B\" scores. Listing two separate descriptions does not."},
  {n:"1.9", t:"Boxplots and outliers", info:"The five-number summary (min, Q1, median, Q3, max) builds a boxplot. The 1.5 × IQR rule flags outliers: below Q1 − 1.5·IQR or above Q3 + 1.5·IQR. Resistant measures (median, IQR) barely move when an outlier is added; the mean and SD do.", key:"Show the fence calculation when asked whether a point is an outlier."},
  {n:"1.10", t:"The normal distribution", info:"The Empirical Rule: about 68% within 1 SD, 95% within 2, 99.7% within 3. Normal calculations use z-scores and Table A or normalcdf. Normal probability plots that look linear suggest normality.", key:"Always sketch, shade, and label the mean and the boundary values."}
 ],
 formulas:["Mean: x̄ = Σxᵢ / n","SD: sₓ = √[ Σ(xᵢ − x̄)² / (n − 1) ]","z = (x − μ) / σ","IQR = Q3 − Q1; fences at Q1 − 1.5·IQR and Q3 + 1.5·IQR"],
 traps:["The mean is pulled toward the tail: skewed right means mean > median.","\"Normal\" is a model. Say the distribution is approximately normal, never that it is normal because a histogram looks bell-shaped.","A percentile describes location, not a score. The 90th percentile means 90% scored at or below.","On an FRQ the word \"describe\" wants SOCS in context; \"compare\" wants comparative language."],
 mcq:[
  {t:"1.5", s:"The salaries of the 25 employees at a startup have a mean of $72,000 and a median of $58,000. Which best describes the shape of the distribution?", o:["Approximately symmetric","Skewed to the left","Skewed to the right","Uniform"], a:2, w:"A mean well above the median means a few high salaries pull the mean up. The long tail is on the high side, so the distribution is skewed right."},
  {t:"1.9", s:"A data set has Q1 = 40 and Q3 = 64. Using the 1.5 × IQR rule, which value would be classified as an outlier?", o:["4","10","98","102"], a:3, w:"IQR = 24, so 1.5 × IQR = 36. The fences are 40 − 36 = 4 and 64 + 36 = 100. Only 102 lies beyond a fence."},
  {t:"1.7", s:"Every student's score on a 50-point quiz is converted to a percent by multiplying by 2. The original scores had a mean of 38 and a standard deviation of 6. The converted scores have", o:["mean 76 and standard deviation 6","mean 76 and standard deviation 12","mean 38 and standard deviation 12","mean 40 and standard deviation 8"], a:1, w:"Multiplying every value by 2 multiplies both the mean and the standard deviation by 2. Adding would have moved the mean only."},
  {t:"1.6", s:"On a test with mean 70 and standard deviation 8, Maya scored 82. Her z-score is", o:["1.5","−1.5","12","0.67"], a:0, w:"z = (82 − 70)/8 = 12/8 = 1.5. She scored 1.5 standard deviations above the mean."},
  {t:"1.10", s:"Heights of adult women are approximately normal with mean 64.5 in and SD 2.5 in. About what percent of women are taller than 69.5 inches?", o:["16%","5%","2.5%","0.15%"], a:2, w:"69.5 is two SDs above the mean. By the Empirical Rule 95% lie within 2 SDs, leaving 5% in both tails together, so 2.5% in the upper tail."},
  {t:"1.5", s:"Which measure of center and spread is most appropriate for a strongly right-skewed distribution of household incomes?", o:["Mean and standard deviation","Mean and IQR","Median and IQR","Median and standard deviation"], a:2, w:"Skewness and the resulting extreme values pull the mean and inflate the SD. The median and IQR are resistant, so they describe a skewed distribution better."},
  {t:"1.3", s:"A histogram of test scores shows two distinct peaks, one around 60 and one around 90. The most likely explanation is", o:["the data are skewed left","the class contains two groups that performed differently","the scores are uniformly distributed","a data entry error"], a:1, w:"Two peaks (bimodal) usually mean two sub-populations mixed together, such as students who studied and students who did not."},
  {t:"1.9", s:"A data set of 12 values has mean 50 and median 48. The largest value, 95, is changed to 195. Which is true?", o:["The mean and the median both increase","The mean increases; the median does not change","The median increases; the mean does not change","Neither changes"], a:1, w:"The median depends only on the ordering of the middle values, and 195 is still the maximum. The mean uses every value, so adding 100 to one value raises it by 100/12 ≈ 8.3."},
  {t:"1.6", s:"The 40th percentile of SAT math scores is 500. This means", o:["40% of students scored exactly 500","40% of students scored at or below 500","a score of 500 is 40% of the maximum","60% of students scored below 500"], a:1, w:"A percentile gives the percent of the distribution at or below that value."},
  {t:"1.8", s:"Parallel boxplots compare commute times for two cities. City A: median 30, IQR 10. City B: median 30, IQR 25. Which statement correctly compares them?", o:["City A has longer typical commutes","City B's commute times are more variable than City A's, though the typical commute is similar","City A has more outliers","The two distributions are identical"], a:1, w:"Equal medians mean a similar typical commute. A larger IQR means the middle half of City B's commutes is spread over a wider range."},
  {t:"1.10", s:"Scores on an exam are approximately normal with mean 500 and SD 100. A student at the 84th percentile scored closest to", o:["584","600","650","700"], a:1, w:"The 84th percentile corresponds to z ≈ 1 (since 50% + 34% = 84%). x = 500 + 1(100) = 600."},
  {t:"1.1", s:"Which of the following is a quantitative variable?", o:["Jersey number of a soccer player","ZIP code","Number of siblings","Eye color"], a:2, w:"Only number of siblings is a count you can meaningfully average. Jersey numbers and ZIP codes are numeric labels, so they are categorical."}
 ],
 frq:{title:"Describing and comparing distributions", prompt:["The dotplots below (described) show the number of hours of sleep reported by 25 juniors and 25 seniors on a school night. Juniors: values from 5 to 9, most between 7 and 8, roughly symmetric, one value at 5. Seniors: values from 4 to 9, most between 6 and 7, skewed slightly right, no gaps.","(a) Compare the distributions of hours of sleep for juniors and seniors.","(b) A senior claims the mean sleep for seniors is above the median. Based on the shape, is this plausible? Explain.","(c) One junior's value of 5 hours is suspected to be an outlier. Describe how you would check this using the 1.5 × IQR rule."],
  model:["(a) Shape: juniors are roughly symmetric while seniors are slightly skewed right. Center: the typical junior sleeps about 7.5 hours, more than the typical senior at about 6.5 hours. Spread: seniors' sleep ranges more widely (4 to 9 hours) than juniors' (5 to 9). Outliers: juniors have a possible low outlier at 5 hours; seniors show none.","(b) Yes. In a right-skewed distribution the long tail of higher values pulls the mean above the median, so a mean above the median is consistent with the shape.","(c) Find Q1 and Q3 of the junior data and compute IQR = Q3 − Q1. Compute the lower fence Q1 − 1.5·IQR. If 5 is below that fence, it is an outlier."],
  rubric:["(a) scores only with comparative language for shape, center, spread AND context (hours of sleep, juniors vs seniors). Separate descriptions of each group earn partial credit at best.","(b) must connect skew direction to the mean being pulled toward the tail.","(c) the fence formula and the comparison rule are both required."]}
},
{id:2, name:"Exploring Two-Variable Data", short:"Two-Variable Data", weight:"5–7%", wmid:6,
 hol:"Expected in Hollinger's spring semester (regression) alongside inference for slopes. Spring calendar not posted yet.",
 big:"For two quantitative variables: describe direction, form, strength and unusual points in context, fit a least-squares line, and judge it with residuals, r, and r².",
 lessons:[
  {n:"2.1–2.3", t:"Two categorical variables", info:"Two-way tables summarize two categorical variables. Marginal distributions use the totals; conditional distributions look inside one row or column. Segmented bar graphs and mosaic plots compare conditional distributions. Association means the conditional distributions differ.", key:"Conditional distribution: divide by the row or column total, not the grand total."},
  {n:"2.4", t:"Scatterplots", info:"Plot the explanatory variable on x and the response on y. Describe direction (positive/negative), form (linear/curved), strength (weak/moderate/strong), and unusual features (outliers, clusters), all in context.", key:"DUFS: direction, unusual features, form, strength."},
  {n:"2.5", t:"Correlation", info:"r measures the strength and direction of a LINEAR relationship, from −1 to 1. It has no units, is unaffected by changing units, treats x and y symmetrically, and is not resistant to outliers.", key:"r near 0 does not mean no relationship. It means no linear relationship."},
  {n:"2.6", t:"Linear regression models", info:"The least-squares regression line ŷ = a + bx minimizes the sum of squared residuals. Slope b: predicted change in y for a one-unit increase in x. Intercept a: predicted y when x = 0 (often meaningless). Extrapolation beyond the data is unreliable.", key:"Interpret slope with the word \"predicted\" and both variables' units."},
  {n:"2.7", t:"Residuals", info:"Residual = actual − predicted = y − ŷ. A residual plot with no pattern says the linear model is appropriate; a curve says it is not. The standard deviation of the residuals s measures the typical prediction error.", key:"Positive residual: the line under-predicted."},
  {n:"2.8", t:"Least-squares regression", info:"b = r · (sᵧ / sₓ) and the line passes through (x̄, ȳ). r² is the percent of variation in y explained by the linear relationship with x. Outliers in the x direction (high leverage) are influential.", key:"\"r² = 0.64: about 64% of the variation in [y] is explained by the linear relationship with [x].\""},
  {n:"2.9", t:"Transforming to achieve linearity", info:"If a scatterplot is curved, transform one variable (log y, √y, 1/x, or log both) and refit. Exponential models become linear with log y; power models with log x and log y.", key:"Predict in the transformed scale, then undo the transformation."}
 ],
 formulas:["ŷ = a + bx, with b = r·sᵧ/sₓ and a = ȳ − b·x̄","Residual = y − ŷ","r² = fraction of variation in y explained by the LSRL"],
 traps:["Correlation is not causation, and r describes only linear patterns.","Switching x and y changes the regression line but not r.","Slope interpretation needs 'predicted' or 'on average' plus units for both variables.","Read computer output: the 'Coef' column gives a (Constant) and b (the x row). 'S' is the residual SD; 'R-Sq' is r² as a percent."],
 mcq:[
  {t:"2.6", s:"A regression of exam score (points) on hours studied gives ŷ = 52 + 4.5x. The correct interpretation of 4.5 is", o:["Each additional hour of studying causes a 4.5-point increase","For each additional hour studied, the predicted exam score increases by 4.5 points","A student who studies 1 hour will score 4.5 points","52% of scores are explained by study time"], a:1, w:"Slope is the predicted change in the response for a one-unit increase in the explanatory variable. 'Causes' is wrong because this is observational data."},
  {t:"2.7", s:"Using ŷ = 52 + 4.5x, a student who studied 6 hours scored 85. The residual is", o:["6","−6","79","85"], a:0, w:"Predicted = 52 + 4.5(6) = 79. Residual = actual − predicted = 85 − 79 = 6. The line under-predicted this student."},
  {t:"2.5", s:"Which statement about the correlation coefficient r is true?", o:["r changes if we convert heights from inches to centimeters","r = 0 proves the variables are unrelated","r measures the strength of any relationship, linear or not","r has the same value whether x predicts y or y predicts x"], a:3, w:"r is symmetric in x and y and unitless. It measures only linear association, and r = 0 means no linear relationship, not no relationship."},
  {t:"2.8", s:"A regression output reports R-Sq = 81.0%. Which is the correct interpretation?", o:["81% of the points lie on the line","The correlation is 0.81","About 81% of the variation in the response is explained by the linear relationship with the explanatory variable","Predictions are correct 81% of the time"], a:2, w:"r² is the fraction of the variability in y accounted for by the LSRL. The correlation would be ±0.9 here, not 0.81."},
  {t:"2.7", s:"A residual plot shows a clear U-shaped pattern. This suggests", o:["the linear model is appropriate","a nonlinear model would fit better","the correlation is close to zero","there is an influential outlier"], a:1, w:"Curvature in the residuals means the straight line misses a systematic pattern. A good linear fit leaves residuals scattered with no pattern."},
  {t:"2.8", s:"For a data set, x̄ = 10, sₓ = 2, ȳ = 50, sᵧ = 8, and r = 0.75. The slope of the LSRL is", o:["0.75","3","0.1875","6"], a:1, w:"b = r·(sᵧ/sₓ) = 0.75 × (8/2) = 3."},
  {t:"2.2", s:"In a two-way table, 60 of 150 seniors and 40 of 50 juniors say they drive to school. Which comparison is appropriate for judging association between grade and driving?", o:["60 vs 40, because more seniors drive","40% of seniors vs 80% of juniors, the conditional distributions","100 of 200 total, the marginal distribution","Nothing, since the groups are different sizes"], a:1, w:"To compare groups of different sizes, compare conditional percentages: 60/150 = 40% vs 40/50 = 80%. Different conditional distributions indicate association."},
  {t:"2.9", s:"A scatterplot of bacteria count versus time curves sharply upward. Which transformation is most likely to straighten it?", o:["Plot time against bacteria count","Plot log(bacteria count) against time","Plot bacteria count against √time","Take the square root of time"], a:1, w:"Exponential growth becomes linear when you take the logarithm of the response variable."},
  {t:"2.6", s:"A regression of weight on height for adults gives ŷ = −220 + 5.5x (x in inches). Using the line to predict the weight of a 20-inch-tall newborn is an example of", o:["interpolation","extrapolation","a residual","confounding"], a:1, w:"20 inches is far outside the range of adult heights used to build the model. Predicting there is extrapolation and unreliable."},
  {t:"2.4", s:"Which description of a scatterplot is complete for an AP free-response answer?", o:["There is a positive relationship","Strong, positive, linear association between hours of practice and score, with one outlier at 2 hours","r = 0.9","The points go up"], a:1, w:"A full description names direction, form, strength and unusual points, in the context of the variables."}
 ],
 frq:{title:"Interpreting regression output", prompt:["A researcher records the number of hours 20 students slept the night before a test (x) and their test scores (y). Computer output: Constant coef 61.2; Sleep coef 3.40; S = 5.8; R-Sq = 52.3%. The scatterplot is roughly linear with no obvious outliers.","(a) Write the equation of the least-squares regression line and define any variables.","(b) Interpret the slope in context.","(c) Interpret r² in context.","(d) A student slept 7 hours and scored 90. Calculate and interpret the residual."],
  model:["(a) ŷ = 61.2 + 3.40x, where x is hours of sleep and ŷ is the predicted test score.","(b) For each additional hour of sleep, the predicted test score increases by 3.40 points.","(c) About 52.3% of the variation in test scores is explained by the linear relationship with hours of sleep.","(d) ŷ = 61.2 + 3.40(7) = 85.0. Residual = 90 − 85.0 = 5.0. This student scored 5 points higher than the line predicted for someone with 7 hours of sleep."],
  rubric:["(a) the hat on ŷ (or the word predicted) matters.","(b) 'predicted' or 'on average' + both units.","(c) 'variation in [response]' + 'linear relationship with [explanatory]'.","(d) show the computation and say whether the actual is above or below predicted."]}
},
{id:3, name:"Collecting Data", short:"Collecting Data", weight:"12–15%", wmid:13,
 hol:"Hollinger Unit 2: Collecting Data (2.1–2.5). Tested 9/24. The Unit 2 Drill built from his practice test is linked below.",
 big:"Random selection lets you generalize; random assignment lets you claim cause. Everything in this unit is a version of that sentence.",
 lessons:[
  {n:"2.1", t:"Types of sampling", info:"Simple random sample: every group of size n equally likely. Stratified: split into similar groups, SRS from each (reduces variability). Cluster: randomly pick whole groups, survey everyone in them (cheaper). Systematic: random start, every kth individual.", key:"Hollinger's shorthand: \"all from some = cluster.\""},
  {n:"2.2", t:"Potential problems with sampling", info:"Bias is a systematic error in one direction. Undercoverage: some group cannot be selected. Nonresponse: selected but did not answer. Response bias: answered untruthfully or inaccurately. Voluntary response: people chose themselves. Convenience sampling picks the easiest people.", key:"A larger sample reduces variability, never bias."},
  {n:"2.3", t:"Observational studies vs. experiments", info:"An experiment imposes a treatment; an observational study only measures. Confounding happens when another variable is associated with the explanatory variable and affects the response, so their effects cannot be separated.", key:"Ask: was a treatment imposed or not?"},
  {n:"2.4", t:"Experimental design", info:"Four principles: comparison, random assignment, control of other variables, replication. Completely randomized, randomized block, and matched pairs designs. Blocking groups similar units so treatment effects are easier to detect. Blinding prevents expectations from affecting results.", key:"Blocking purpose sentence: reduces variability from the blocking variable so treatment differences are easier to see."},
  {n:"2.5", t:"Scope of inference", info:"Random sample from a population → generalize to that population. Random assignment to treatments → conclude cause and effect. Both, one, or neither: the 2 × 2 box.", key:"Volunteers randomly assigned: cause and effect, but only for people like these subjects."}
 ],
 formulas:["No formulas. This unit is scored on vocabulary used precisely and in context."],
 traps:["Random sample ≠ random assignment. One decides generalization, the other decides causation.","Stratified samples take some from every group; cluster samples take all from some groups.","A control group does not need a placebo; it is any baseline comparison.","\"Describe how\" answers need a labeling method, a random mechanism, what to do with repeats, and a stopping rule."],
 mcq:[
  {t:"2.1", s:"A principal numbers all 1,200 students and uses a random number generator to pick 60. This is a", o:["stratified random sample","cluster sample","simple random sample","systematic sample"], a:2, w:"Every group of 60 students is equally likely. No groups were formed first and no fixed interval was used."},
  {t:"2.1", s:"A pollster divides a city into 300 blocks, randomly selects 15 blocks, and interviews every adult living on those blocks. This is", o:["a stratified random sample","a cluster sample","a simple random sample","a convenience sample"], a:1, w:"Whole groups (blocks) are randomly chosen and everyone inside is surveyed: all from some."},
  {t:"2.2", s:"A magazine prints a survey and asks readers to mail in responses. 2,000 reply, and 85% oppose a new tax. The 85% is most likely", o:["accurate, because 2,000 is a large sample","too high, because of voluntary response bias","too low, because of undercoverage","unbiased, because the readers were randomly chosen"], a:1, w:"Readers chose to respond; people with strong opinions are over-represented. A large sample does not fix bias."},
  {t:"2.3", s:"Researchers find that students who eat breakfast have higher GPAs. A possible confounding variable is", o:["GPA","eating breakfast","the number of students","family income, which could affect both breakfast habits and GPA"], a:3, w:"A confounding variable is associated with the explanatory variable and also affects the response, so their effects cannot be separated."},
  {t:"2.4", s:"In an experiment testing a new fertilizer, the researcher wants to account for the fact that one side of the field gets more sun. The best design is", o:["a completely randomized design","a randomized block design with sun exposure as the blocking variable","a matched pairs design pairing random plants","a simple random sample of plots"], a:1, w:"Sun exposure is a known variable expected to affect growth. Block on it, then randomize treatments within each block."},
  {t:"2.4", s:"In a double-blind experiment,", o:["subjects do not know which treatment they receive, but researchers do","neither the subjects nor the people measuring the response know who got which treatment","no one ever learns which group received the treatment","the subjects are randomly selected from the population"], a:1, w:"Double-blind means both the subjects and those administering or evaluating are unaware during the experiment."},
  {t:"2.5", s:"200 volunteers are randomly assigned to two study methods. Method A produces significantly higher scores. Which conclusion is justified?", o:["Method A causes higher scores for all students","Method A causes higher scores for subjects like these volunteers","Method A is associated with higher scores, but no causal claim is possible","No conclusion is possible because volunteers were used"], a:1, w:"Random assignment supports cause and effect. Without a random sample, generalization is limited to people similar to the volunteers."},
  {t:"2.4", s:"Why is random assignment used in an experiment?", o:["To make the sample representative of the population","To balance the effects of other variables across treatment groups","To guarantee the groups are identical","To increase the sample size"], a:1, w:"Random assignment creates groups that are roughly equivalent, so differences in the response can be attributed to the treatments. It never guarantees identical groups."},
  {t:"2.2", s:"A survey calls landline phones only. Younger adults, who mostly have only cell phones, are missed. This is an example of", o:["nonresponse","undercoverage","response bias","voluntary response"], a:1, w:"A group in the population has no chance of being selected by the method: undercoverage."},
  {t:"2.4", s:"Each subject in a taste test tries both brands of cola in random order and picks a favorite. This design is", o:["completely randomized","matched pairs","stratified","observational"], a:1, w:"Each subject receives both treatments in random order, which is a matched pairs design (a block of size one subject)."},
  {t:"2.1", s:"A school wants opinions from freshmen, sophomores, juniors and seniors and expects grade levels to differ. The design most likely to reduce variability is", o:["an SRS of 100 students","a stratified sample with an SRS from each grade","a cluster sample of three homerooms","a systematic sample of every 10th student in the directory"], a:1, w:"Stratifying on a variable related to the response guarantees every group is represented and reduces sampling variability."},
  {t:"2.4", s:"An experiment has one factor, type of music (classical, pop, none), and another factor, volume (low, high). How many treatments are there?", o:["2","3","5","6"], a:3, w:"Treatments are combinations of factor levels: 3 × 2 = 6."}
 ],
 frq:{title:"Designing an experiment", prompt:["A company wants to know whether a new app reduces the time employees spend on email. 80 employees volunteer. Half the employees work in sales (heavy email users) and half in engineering.","(a) Describe a completely randomized design using the 80 volunteers.","(b) Explain why a randomized block design, blocking on department, might be better.","(c) If the app group shows significantly less email time, can the company conclude the app caused the reduction? Can it generalize to all its employees? Explain both."],
  model:["(a) Label the 80 volunteers 1–80. Use a random number generator to select 40 distinct numbers, ignoring repeats. Those 40 use the new app for a month; the other 40 keep their usual email tools. Compare mean daily email time between the two groups.","(b) Department is expected to affect email time (sales uses more). Blocking by department and randomly assigning 20 of the 40 sales employees and 20 of the 40 engineers to the app removes variability due to department, making a real app effect easier to detect.","(c) Cause: yes, because the app was randomly assigned, so other variables are balanced between groups. Generalization: only to employees similar to these volunteers, because they were not randomly selected from all employees."],
  rubric:["(a) four parts: label, random mechanism, ignore repeats, stop at 40; then say how the response is compared.","(b) must say department is expected to affect the response and that blocking reduces variability.","(c) random assignment → cause; no random sample → limited generalization. Two separate justifications."]}
}
