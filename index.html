      <mask id="m"><rect width="${W}" height="${base}" fill="url(#fade)"/></mask>
    </defs>
    <rect width="${W}" height="${base}" fill="url(#gmaj)" mask="url(#m)"/>`;
  if(taught < n) s += `<path d="${pts(zNow,zNext)} L${X(zNext).toFixed(2)} ${base} L${X(zNow).toFixed(2)} ${base}Z" fill="url(#hatch)"/>`;
  if(taught > 0) s += `<path class="${heroFirst?'area':''}" d="${pts(zmin,zNow)} L${X(zNow).toFixed(2)} ${base} L0 ${base}Z" fill="${cssVar('--gold')}"/>`;
  const qa = p.quizAfter, showQuiz = p.quiz && qa>0 && qa<n;
  for(let k=1;k<n;k++){ const x = X(quant(k/n)).toFixed(2), qz = showQuiz && k===qa;
    s += `<line x1="${x}" x2="${x}" y1="${qz? flagY+6 : Y(quant(k/n)).toFixed(2)}" y2="${base}" stroke="${ink}" stroke-opacity="${qz?.6:.28}" ${qz?'stroke-dasharray="3 3"':''}/>`; }
  s += `<path d="${pts(zmin,zmax)}" fill="none" stroke="${ink}" stroke-width="${phone?2:2.25}" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="${ink}"/>`;
  // lesson labels: every lesson on desktop; first, next and last on phone
  const mid = k => (X(quant((k-1)/n)) + X(quant(k/n)))/2;
  for(let k=1;k<=n;k++){
    if(phone && k!==1 && k!==taught+1 && k!==n) continue;
    const l = p.les[k-1], next = k===taught+1;
    s += `<text class="${k<=taught+1?'lt':''}" x="${mid(k).toFixed(2)}" y="${base+18}" text-anchor="middle">${esc(l.label)}${next? ' '+esc(cap(dayWord(l.c.date, true))) : ''}</text>`;
  }
  // flags above the plot: quiz at its lesson boundary, test at the right edge
  const tw = str => str.length*7.2;
  let testTxt = '';
  if(p.test){ testTxt = 'Test '+dayWord(p.test.date, true); const xt = W-1;
    s += `<line x1="${xt}" x2="${xt}" y1="${flagY+6}" y2="${base}" stroke="${ink}" stroke-opacity=".6" stroke-dasharray="3 3"/><text class="flag" x="${xt-8}" y="${flagY}" text-anchor="end">${esc(testTxt)}</text>`; }
  if(showQuiz){ const xq = X(quant(qa/n)), txt = 'Quiz '+dayWord(p.quiz.date, true);
    const clash = xq+6+tw(txt) > W-8-tw(testTxt)-12;
    s += `<text class="flag" x="${(clash? xq-6 : xq+6).toFixed(2)}" y="${flagY}" text-anchor="${clash?'end':'start'}">${esc(txt)}</text>`; }
  // today: dot where the gold ends
  const xn = X(zNow), yn = Y(zNow), left = xn < 70;
  s += `<circle cx="${xn.toFixed(2)}" cy="${yn.toFixed(2)}" r="5.5" fill="${ink}" stroke="${cssVar('--page')}" stroke-width="2.5"/>
    <text class="today" x="${(left? xn+12 : xn-12).toFixed(2)}" y="${(yn-8).toFixed(2)}" text-anchor="${left?'start':'end'}">today</text></svg>`;
  el.innerHTML = s; heroFirst = false;
}

function renderToday(){

  hero = null;
  if(p.lessons){
    const share = p.taught/p.lessons, exact = Math.abs(share*100 - Math.round(share*100)) < 1e-9;
    const val = share===0? '0' : share===1? '1' : share.toFixed(2);
    const togo = p.lessons - p.taught, testAhead = p.test && p.test.date >= t;
    let b, sp;
    if(p.taught===0){ b = 'No lessons taught yet'; sp = `${p.les[0].label} starts ${dayWord(p.les[0].c.date)}`; }
    else if(togo>0){ b = `${p.taught} of ${p.lessons} lessons taught`; sp = testAhead? `${plural(togo,'lesson')} to go before the test` : `${plural(togo,'lesson')} to go`; }
    else { b = `All ${p.lessons} lessons taught`; sp = testAhead? `The test is ${dayWord(p.test.date)}` : p.test? `The unit test was ${fmtDate(p.test.date)}` : 'The unit is finished'; }
    h += `<section class="hero" aria-label="Unit ${cu} progress"><div class="hero-top"><div class="num serif"><i>P(X ≤ today) ${exact?'=':'≈'}</i>${val}</div><div class="read"><b>${b}</b><span>${sp}</span></div></div>
      <div class="plot" id="plot"></div><p class="foot">Each lesson is an equal slice of the area. Width is not time.</p></section>`;
    hero = p;
  } else {
    h += `<p class="intro">Unit ${cu} is not on the class calendar yet.</p>`;
  }

  // left column: the nearest quiz or test
  const tgt = CAL.find(c => c.date >= t && (c.kind==='quiz' || c.kind==='test'));
  let left = '';
  if(tgt){
    const tu = unitOf(tgt) || cu, tp = unitPlan(tu), kind = tgt.kind, hw = tgt.hw || '';
    const pk = hw.match(/(\d+\.\d+)\s*-\s*(\d+\.\d+)\s*Packet Due/i), practice = /Practice Test Due/i.test(hw);
    const before = tp.les.filter(l => l.c.date <= tgt.date), after = tp.les.filter(l => l.c.date > tgt.date);
    const span = ls => !ls.length? '' : ls[0].first===ls[ls.length-1].last? ls[0].first : `${ls[0].first} to ${ls[ls.length-1].last}`;
    const covers = kind==='quiz'? (pk? `${pk[1]} to ${pk[2]}` : span(before)) : span(tp.les);
    const dw = dayWord(tgt.date), when = withinWeek(tgt.date)? dw : 'on '+dw;
    const head = withinWeek(tgt.date)? `Get ready for ${dw}’s ${kind}` : `Get ready for the ${kind} on ${dw}`;
    let sub = kind==='quiz'? (covers? `Covers ${covers}.` : '') : `Covers all of Unit ${tu}${covers? ', '+covers : ''}.`;
    if(kind==='quiz' && pk && !practice) sub += ` Packet due ${when} too.`;
    else { const items = []; if(practice) items.push('the practice test'); if(pk) items.push(`the ${pk[1]} to ${pk[2]} packet`);
      if(items.length) sub += ` ${cap(items.join(' and '))} ${items.length>1?'are':'is'} due ${when} too.`; }
    const extra = kind==='quiz' && after.length? `<div class="note">The drill covers all of Unit ${tu}, including ${span(after)}.</div>` : '';
    left = `<h2>${head}</h2><div class="sub">${esc(sub.trim())}</div><button class="btn" data-go-drill="${tu}">Drill Unit ${tu}</button>${extra}
      <div class="list">
        <button class="row" data-go-unit="${tu}" data-sub="cram"><span class="ic">${ic('layers')}</span><span class="t">Cram card</span><span class="v">Formulas and traps</span>${CHEV}</button>
        <button class="row" data-go-unit="${tu}" data-sub="lessons"><span class="ic">${ic('book-open')}</span><span class="t">Lesson notes</span><span class="v">${covers || 'Unit '+tu}</span>${CHEV}</button>
        <button class="row" data-go-unit="${tu}" data-sub="last"><span class="ic">${ic('timer')}</span><span class="t">Last-minute review</span><span class="v">Before the ${kind}</span>${CHEV}</button>
      </div>`;
  } else if(daysUntil(AP_EXAM) >= 0 && daysUntil(AP_EXAM) <= 30){
    const ad = daysUntil(AP_EXAM);
    left = `<h2>${ad<=6? `Get ready for ${dayWord(AP_EXAM)}’s AP exam` : 'Get ready for the AP exam'}</h2><div class="sub">Tue, May 11 at 12 pm${ad>1? `, ${ad} days from now` : ''}. A mixed drill covers all 9 units the way Section I does.</div><button class="btn" data-go-drill="0">Start a mixed drill</button>
      <div class="list"><button class="row" data-go-tab="exam"><span class="ic">${ic('clipboard-check')}</span><span class="t">Exam guide</span><span class="v">Scoring and habits</span>${CHEV}</button></div>`;
  } else {
    left = `<h2>No quiz or test on the calendar</h2><div class="sub">The spring calendar is not posted yet. A mixed drill keeps every unit fresh.</div><button class="btn" data-go-drill="0">Start a mixed drill</button>
      <div class="list"><button class="row" data-go-unit="${cu}" data-sub="cram"><span class="ic">${ic('layers')}</span><span class="t">Unit ${cu} cram card</span><span class="v">Formulas and traps</span>${CHEV}</button></div>`;
  }

  // right column: the next four lessons, then the drill record if there is one
  const next = CAL.filter(c => c.date >= t && isLessonDay(c)).slice(0,4);
  let right = `<div class="h3">Next in class</div><div class="list">${next.length? next.map(c => `<div class="row"><span class="d">${c.date===t?'Today':fmtDate(c.date)}</span><span class="t">${esc(cleanLesson(c.lesson))}</span></div>`).join('')

  let seen=0, rt=0; Object.values(hist).forEach(x => { seen+=x.seen; rt+=x.right; });
  if(seen){
    const weakest = UNITS.map(u => ({u, s:unitStats(u)})).filter(x => x.s.seen>=4).sort((a,b) => a.s.acc-b.s.acc)[0];
    right += `<div class="h3 gap">Your drill record</div><div class="list"><div class="row"><span class="t">All units</span><span class="v">${Math.round(100*rt/seen)}% of ${seen} right</span></div>
      ${weakest? `<button class="row" data-go-drill="${weakest.u.id}"><span class="t">Weakest is Unit ${weakest.u.id}, ${NAV_NAME[weakest.u.id]}</span><span class="v">${Math.round(100*weakest.s.acc)}%</span>${CHEV}</button>` : ''}</div>`;
  }
  h += `<div class="cols"><section class="col">${left}</section><section class="col">${right}</section></div><p class="ap-m">${apLine().m}</p>`;
  const el = document.getElementById('v-today'); el.innerHTML = h; wireGo(el);
  drawHero();
}
function wireGo(root){

  <details><summary>${CHEV}Model answer and what earns the points</summary><div class="body prose">${f.model.map(p => `<p>${esc(p)}</p>`).join('')}<div class="rubric">${f.rubric.map(r => `<div>${esc(r)}</div>`).join('')}</div></div></details>
  ${sel+1<list.length?`<div class="btns"><button class="btn" id="nextfrq">Next free response</button></div>`:''}
  <div class="sec"><h2>How every FRQ is scored</h2><ul class="ul"><li>Each part is marked <b>E</b>ssentially correct, <b>P</b>artially correct, or <b>I</b>ncorrect, then combined into a score from 0 to 4: 4 Complete, 3 Substantial, 2 Developing, 1 Minimal.</li><li>Answers must be in <b>context</b>: name the variable, the population, the units.</li><li>Inference follows State, Plan, Do, Conclude, with conditions checked using numbers.</li><li>Never leave a part blank. A partial attempt scores; a blank never does.</li></ul></div>`;
  const go = i => { store.set('frqsel-'+u.id, i); renderUnitFRQ(u, body); };
  body.querySelectorAll('.seg button').forEach(c => c.addEventListener('click', () => go(+c.dataset.i)));
  const nx = body.querySelector('#nextfrq'); if(nx) nx.addEventListener('click', () => { go(sel+1); body.scrollIntoView({block:'start'}); });
  const ta = body.querySelector('textarea'); ta.value = store.get('frqtext-'+u.id+'-'+sel, ''); ta.addEventListener('input', () => store.set('frqtext-'+u.id+'-'+sel, ta.value));
}

/* ---------- drill engine (renders into a host element) ---------- */
let run = null;
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const intoView = host => { const r = host.getBoundingClientRect(); if(r.top < 0) host.scrollIntoView({block:'start'}); };
function renderDrillHome(host, u){
  if(run && ((u && run.unit===u.id) || (!u && run.mixed))){ renderQuestion(host); return; }
  const pool = u? u.mcq : ALLQ;
  const missed = pool.filter(q => hist[q.id] && hist[q.id].right < hist[q.id].seen); const unseen = pool.filter(q => !hist[q.id]);
  const seenN = pool.length - unseen.length, seenTxt = !seenN? 'none seen yet' : !unseen.length? 'all seen' : `${seenN} seen`;
  let h = `${u? `<h2 style="margin-top:20px">Drill Unit ${u.id}</h2>` : ''}
  <p class="sub"${u?'':' style="margin-top:20px"'}>${plural(pool.length,'question')}${u?'':' from all 9 units'}, ${seenTxt}${missed.length? `, ${missed.length} missed before` : ''}. Graded one at a time, with the reason.</p>
  <div class="btns"><button class="btn" id="start10">Start 10</button><button class="btn sec2" id="startAll">All ${pool.length} in order</button>${missed.length?`<button class="btn sec2" id="startMissed">Retry ${missed.length} missed</button>`:''}</div>`;
  const rows = (u? [u] : UNITS).map(x => ({x, s:unitStats(x)})).filter(r => r.s.seen);
  if(rows.length) h += `<div class="sec"><div class="h3">Your record</div><div class="list">${rows.map(r => `<div class="row two"><span class="t">Unit ${r.x.id}, ${NAV_NAME[r.x.id]}<span class="s">${r.s.right} of ${r.s.seen} correct</span></span><span class="v">${Math.round(100*r.s.acc)}%</span></div>`).join('')}</div>
    <div class="btns"><button class="btn plain" id="clearHist">Clear ${u?'this unit’s':'my'} record</button></div></div>`;
  host.innerHTML = h;
  const start = qs => { run = {qs, i:0, right:0, answers:[], unit:u?u.id:0, mixed:!u}; renderQuestion(host); };
  host.querySelector('#start10').addEventListener('click', () => start(shuffle(unseen.length>=10? unseen : pool).slice(0,10)));
  host.querySelector('#startAll').addEventListener('click', () => start(pool.slice()));
  const sm = host.querySelector('#startMissed'); if(sm) sm.addEventListener('click', () => start(shuffle(missed)));
  const ch = host.querySelector('#clearHist'); if(ch) ch.addEventListener('click', () => { if(ch.dataset.arm){ pool.forEach(q => delete hist[q.id]); store.set('hist', hist); renderDrillHome(host, u); } else { ch.dataset.arm='1'; ch.textContent='Tap again to erase'; ch.classList.add('arm'); } });
}
function renderQuestion(host){
  if(run.i >= run.qs.length){ renderRunSummary(host); return; }
  const q = run.qs[run.i]; const pct = Math.round(100*run.i/run.qs.length);
  host.innerHTML = `<div class="prog"><div class="trk"><i style="width:${pct}%"></i></div><div class="n">${run.i+1} of ${run.qs.length}</div><button class="btn plain" id="quit">Quit</button></div>
  <div id="qcard"><div class="qmeta"><span class="topic">${run.mixed?'Unit '+q.unit+', ':''}${esc(q.t)}</span><span class="tab">${run.right} right so far</span></div><p class="stem">${esc(q.s)}</p>
  <div class="opts">${q.o.map((o,i) => `<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="why"></div></div>`;
  intoView(host);
  host.querySelector('#quit').addEventListener('click', () => { const mixed = run.mixed, uid = run.unit; run = null; if(mixed) renderMixed(); else renderUnit(uid, 'drill'); });
  host.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.i, host)));
}
function answer(i, host){
  const q = run.qs[run.i]; const card = host.querySelector('#qcard'); if(card.classList.contains('locked')) return;
  const ok = i===q.a; card.classList.add('locked');
  card.querySelectorAll('.opt').forEach((b,j) => { b.setAttribute('aria-disabled','true');
    if(j===i){ b.classList.add(ok?'pick-right':'pick-wrong'); b.querySelector('.k').innerHTML = ic(ok?'check':'x'); }
    else if(j===q.a) b.classList.add('reveal');
    else b.classList.add('dim'); });
  const hh = hist[q.id] || {seen:0, right:0}; hh.seen++; if(ok) hh.right++; hist[q.id] = hh; store.set('hist', hist);
  if(ok) run.right++; run.answers.push({q, ok});
  const tb = host.querySelector('.qmeta .tab'); if(tb) tb.textContent = `${run.right} right so far`;
  const tk = host.querySelector('.prog .trk i'); if(tk) tk.style.width = ((run.i+1)/run.qs.length*100)+'%';
  host.querySelector('#why').innerHTML = `<div class="why"><div class="verdict ${ok?'ok':'no'}">${ic(ok?'check':'x')}${ok?'Correct':'Not quite. The answer is '+'ABCD'[q.a]+'.'}</div><p>${esc(q.w)}</p></div><div class="btns"><button class="btn" id="next">${run.i+1<run.qs.length?'Next question':'See results'}</button></div>`;
  const nx = host.querySelector('#next'); nx.addEventListener('click', () => { run.i++; renderQuestion(host); }); nx.focus({preventScroll:true});
}
function renderRunSummary(host){
  const n = run.qs.length, pct = Math.round(100*run.right/n);
  const byTopic = {}; run.answers.forEach(a => { const k = (run.mixed?'Unit '+a.q.unit+', ':'')+a.q.t; byTopic[k] = byTopic[k]||{n:0,r:0}; byTopic[k].n++; if(a.ok) byTopic[k].r++; });
  const missed = run.answers.filter(a => !a.ok).map(a => a.q); const mixed = run.mixed, uid = run.unit;
  let h = `<div class="score"><div class="big serif">${run.right}<small>/${n}</small></div><div class="read"><b>${pct>=80?'Test-ready':pct>=60?'Getting there':'Keep going'}</b><span>${pct}% correct. ${pct>=80?'Now do the free response.':pct>=60?'Re-read the cram card for what you missed.':'Cram card first, then retry.'}</span></div></div>
  <div class="btns">${missed.length?`<button class="btn" id="again">Retry ${missed.length} missed</button><button class="btn sec2" id="back">Done</button>`:`<button class="btn" id="back">Done</button>`}</div>
  <div class="sec"><div class="h3">By topic</div><div class="list">${Object.entries(byTopic).map(([k,v]) => `<div class="row"><span class="t">${esc(k)}</span><span class="v">${v.r} of ${v.n}</span></div>`).join('')}</div></div>`;
  if(missed.length) h += `<div class="sec"><h2>What you missed</h2>${missed.map(q => `<div class="missed"><div class="h3">${run.mixed?'Unit '+q.unit+', ':''}${esc(q.t)}</div><p>${esc(q.s)}</p><p class="a">${'ABCD'[q.a]}. ${esc(q.o[q.a])}</p><p class="w">${esc(q.w)}</p></div>`).join('')}</div>`;
  host.innerHTML = h; intoView(host);
  const ag = host.querySelector('#again'); if(ag) ag.addEventListener('click', () => { run = {qs:shuffle(missed), i:0, right:0, answers:[], unit:uid, mixed}; renderQuestion(host); });
  host.querySelector('#back').addEventListener('click', () => { run = null; if(mixed) renderMixed(); else renderUnit(uid, 'drill'); });
}

/* ---------- exam ---------- */
const DIST = [[5,17.0],[4,21.4],[3,21.9],[2,15.9],[1,23.7]];
const CUTS = [[33,2],[44,3],[57,4],[70,5]];
function renderExam(){
  let h = `<div class="date">Tuesday, May 11, 2027, at 12 pm</div><h1>The AP exam</h1>
  <p class="intro">Three hours in two halves worth 50% each. Calculator allowed throughout; formula sheet and tables provided.</p>
  <div class="list" style="margin-top:20px">
    <div class="row two"><span class="d">Section I</span><span class="t">Multiple choice, 40 questions<span class="s">1 hr 30 min. No penalty for guessing.</span></span><span class="v">50%</span></div>
    <div class="row two"><span class="d">Section II, Part A</span><span class="t">Free response, 5 questions<span class="s">About 65 min: exploring data, collecting data, probability or sampling, and inference.</span></span><span class="v">37.5%</span></div>
    <div class="row two"><span class="d">Part B</span><span class="t">Investigative task, 1 question<span class="s">About 25 min. Stretches course ideas into a new setting.</span></span><span class="v">12.5%</span></div>
  </div>
  <p class="note measure">Since 2025 the exam is hybrid digital: multiple choice in the Bluebook app, free responses handwritten in a booklet while the questions appear on screen.</p>

  <div class="sec"><h2>Score predictor</h2><p class="sub measure">Each multiple-choice answer is 1.25 points. FRQs 1 to 5 are scored 0 to 4 and multiplied by 1.875; the task by 3.125. Composite out of 100.</p>
  <div class="calc"><label>MC of 40<input id="mc" type="number" inputmode="numeric" min="0" max="40" value="${store.get('calc-mc',28)}"></label>
  ${[1,2,3,4,5].map(i => `<label>FRQ ${i}<input id="f${i}" type="number" inputmode="numeric" min="0" max="4" value="${store.get('calc-f'+i,[3,3,3,2,2][i-1])}"></label>`).join('')}
  <label>Task<input id="f6" type="number" inputmode="numeric" min="0" max="4" value="${store.get('calc-f6',2)}"></label></div>
  <div class="result"><div><div class="big serif" id="comp">0</div><div class="cap">Composite of 100</div></div><div><div class="big serif" id="ap">1</div><div class="cap">Predicted AP score</div></div></div>
  <div class="scale" aria-hidden="true"><div class="trk"></div><div class="fill" id="sfill"></div>${CUTS.map(([x,s]) => `<div class="tick serif" data-s="${s}" style="left:${x}%">${s}</div>`).join('')}</div>
  <p class="note">Typical cut points from recent exams: 5 at about 70, 4 at 57, 3 at 44, 2 at 33.</p></div>

  <div class="sec"><h2>How free response is graded</h2><div class="two-up">
    <div><div class="h3" style="margin-top:16px">The 0 to 4 scale</div><ul class="ul"><li><b>4 Complete:</b> every part essentially correct</li><li><b>3 Substantial:</b> small slips, one part partial</li><li><b>2 Developing:</b> about half the parts earned</li><li><b>1 Minimal:</b> one part right or several partials</li><li><b>0:</b> nothing creditable</li></ul></div>
    <div><div class="h3" style="margin-top:16px">What readers look for</div><ul class="ul"><li>Vocabulary used <b>precisely</b> (random assignment, not “randomized”)</li><li><b>Context</b> in every conclusion</li><li>Conditions checked <b>with numbers</b></li><li>Calculator commands with <b>inputs labeled</b></li><li>Conclusions that compare P to α, decide, then say what it means about Hₐ</li></ul></div>
  </div></div>

  <div class="sec"><h2>Unit weights</h2><div class="bars" style="margin-top:12px">${UNITS.map(u => `<div class="brow"><div class="nm"><b>${u.id}</b>${esc(u.name)}</div><div class="pc">${esc(u.weight)}</div><div class="bar"><i style="width:${u.wmid*4}%"></i></div></div>`).join('')}</div></div>

  <div class="sec"><h2>2025 score distribution</h2><p class="sub">266,791 students. Mean 2.92. 60.3% earned a 3 or higher.</p><div class="bars dist" style="margin-top:12px">${DIST.map(([s,p]) => `<div class="brow"><div class="sc serif">${s}</div><div class="bar"><i style="width:${p*3.5}%"></i></div><div class="pc">${p.toFixed(1)}%</div></div>`).join('')}</div></div>

  <div class="sec"><h2>Exam-day habits</h2><ul class="ul"><li><b>Read the question first</b>, then the setup. Mr. Hollinger’s own margin note.</li><li>Absolute words (always, prove, ensure, eliminate) are almost never in the right choice.</li><li>40 questions in 90 minutes is 2:15 each. Mark and move on.</li><li>The investigative task’s last parts build on earlier parts. Partial credit is real.</li><li>Write the hat on p̂ and x̄, and define every parameter in words.</li></ul></div>`;
  const el = document.getElementById('v-exam'); el.innerHTML = h;
  const calc = () => {
    const v = id => { const i = el.querySelector('#'+id); return Math.max(0, Math.min(+i.max, +i.value || 0)); };
    const mc = v('mc'), fs = ['f1','f2','f3','f4','f5'].map(v), f6 = v('f6');
    ['mc','f1','f2','f3','f4','f5','f6'].forEach(id => store.set('calc-'+id, v(id)));
    const comp = mc*1.25 + fs.reduce((a,b)=>a+b,0)*1.875 + f6*3.125, ap = comp>=70?5:comp>=57?4:comp>=44?3:comp>=33?2:1;

    el.querySelector('#sfill').style.width = Math.min(100, comp)+'%';
    el.querySelectorAll('.scale .tick').forEach(t => t.classList.toggle('hit', +t.dataset.s===ap));

  el.querySelectorAll('input').forEach(i => i.addEventListener('input', calc)); calc();
}

function calRows(list){

}

/* ---------- boot ---------- */
function route(hs){
  const m = hs.match(/^unit-(\d)(?:-(\w+))?$/);
  if(m && UNITS.some(u => u.id===+m[1])){ showTab('units'); renderUnit(+m[1], SUBS.some(s => s[0]===m[2])? m[2] : (subSel || 'cram')); return true; }
  if(hs==='mixed'){ showTab('units'); renderMixed(); return true; }
  if(TABS.includes(hs)){ showTab(hs); return true; }
  return false;
}

if(!route((location.hash||'').replace('#',''))){
